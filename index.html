<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TBD Scoring</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #21262d; --border: #30363d;
  --green: #238636; --green-bright: #2ea043; --green-dim: #1a3a25; --green-text: #56d364;
  --red: #b91c1c; --red-bright: #da3633; --red-dim: #3a1a1a; --red-text: #f85149;
  --blue: #1f6feb; --blue-dim: #0d2a4a; --blue-text: #79c0ff;
  --purple: #6e40c9; --purple-dim: #1e1040; --purple-text: #d2a8ff;
  --gold: #d29922; --gold-bright: #e3b341; --gold-dim: #2d2007;
  --white: #f0f6fc; --muted: #8b949e; --radius: 10px;
}
html, body { height: 100%; background: var(--bg); color: var(--white); font-family: 'IBM Plex Sans', sans-serif; overflow: hidden; }
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; }

/* ── SHARED ── */
.screen { flex: 1; overflow-y: auto; padding: 20px 16px 40px; }
.top-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.top-bar-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.1em; color: var(--gold-bright); }
.back-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; padding: 5px 10px; cursor: pointer; }
.back-btn:hover { border-color: var(--gold); color: var(--gold); }
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto; }
.tab { flex: 1; min-width: 70px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 4px; cursor: pointer; white-space: nowrap; }
.tab.active { color: var(--gold-bright); border-bottom-color: var(--gold-bright); }
.tab-content { flex: 1; overflow-y: auto; padding: 16px; }
.section-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 8px; margin-top: 16px; }
.section-label:first-child { margin-top: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.field-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.field-row:last-child { margin-bottom: 0; }
.field-label { color: var(--muted); font-size: 0.85rem; flex: 1; }
.text-input { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; color: var(--white); font-family: 'IBM Plex Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.15s; width: 100%; }
.text-input:focus { border-color: var(--gold); }
.num-input { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; color: var(--white); font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; outline: none; width: 70px; text-align: right; -moz-appearance: textfield; }
.num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.num-input:focus { border-color: var(--gold); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; }
.toggle-label { color: var(--white); font-size: 0.9rem; }
.toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 24px; cursor: pointer; transition: 0.2s; }
.toggle-slider:before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: var(--white); border-radius: 50%; transition: 0.2s; }
.toggle input:checked + .toggle-slider { background: var(--green); }
.toggle input:checked + .toggle-slider:before { transform: translateX(20px); }
.big-btn { width: 100%; border: none; border-radius: var(--radius); font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.12em; padding: 15px; cursor: pointer; transition: all 0.15s; margin-bottom: 10px; }
.big-btn:active { transform: scale(0.98); }
.big-btn.green { background: var(--green); color: var(--white); }
.big-btn.green:hover { background: var(--green-bright); }
.big-btn.gold { background: var(--gold); color: var(--bg); }
.big-btn.gold:hover { background: var(--gold-bright); }
.big-btn.ghost { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 1.1rem; }
.big-btn.ghost:hover { border-color: var(--gold); color: var(--gold); }
.big-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }
.chip { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; font-weight: 500; display: inline-block; }
.chip.green { background: var(--green-dim); color: var(--green-text); border: 1px solid var(--green); }
.chip.red { background: var(--red-dim); color: var(--red-text); border: 1px solid var(--red); }
.chip.blue { background: var(--blue-dim); color: var(--blue-text); border: 1px solid var(--blue); }
.chip.purple { background: var(--purple-dim); color: var(--purple-text); border: 1px solid var(--purple); }
.chip.gray { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.chip.gold { background: var(--gold-dim); color: var(--gold-bright); border: 1px solid var(--gold); }
.seg-control { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg-btn { flex: 1; background: none; border: none; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; padding: 7px 4px; cursor: pointer; transition: all 0.15s; }
.seg-btn.active { background: var(--gold); color: var(--bg); font-weight: 600; }

/* ── HOME ── */
.home-logo { text-align: center; padding: 32px 0 24px; }
.home-logo h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 0.12em; color: var(--gold-bright); line-height: 1; }
.home-logo p { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 6px; }
.game-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 16px; }
.game-card:hover, .game-card:active { border-color: var(--gold); background: var(--surface2); }
.game-card-icon { font-size: 2rem; width: 48px; text-align: center; flex-shrink: 0; }
.game-card-text h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.1em; color: var(--white); }
.game-card-text p { color: var(--muted); font-size: 0.78rem; margin-top: 3px; }

/* ── SETUP ── */
.player-setup-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.player-setup-row:last-child { margin-bottom: 0; }
.player-idx { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--gold); width: 20px; flex-shrink: 0; }
.player-setup-row .text-input { flex: 2; }
.player-setup-row .num-input { width: 55px; }
.remove-btn { background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 4px; }
.remove-btn:hover { color: var(--red-text); }
.add-btn { width: 100%; background: none; border: 1px dashed var(--border); border-radius: 7px; color: var(--muted); font-size: 0.85rem; padding: 9px; cursor: pointer; margin-top: 4px; }
.add-btn:hover { border-color: var(--gold); color: var(--gold); }
.team-select { display: flex; gap: 6px; }
.team-btn { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; letter-spacing: 0.08em; padding: 6px; cursor: pointer; text-align: center; transition: all 0.15s; }
.team-btn.team-a { }
.team-btn.team-b { }
.team-btn.selected-a { background: var(--blue-dim); border-color: var(--blue-text); color: var(--blue-text); }
.team-btn.selected-b { background: var(--purple-dim); border-color: var(--purple-text); color: var(--purple-text); }

/* ── SCORECARD ── */
.hole-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.hole-nav-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--white); letter-spacing: 0.06em; }
.hole-nav-sub { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
.hole-meta { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.hole-meta-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
.hole-meta-item span { color: var(--white); font-weight: 600; }
.score-entry { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.score-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.score-player-name { flex: 1; font-weight: 600; font-size: 0.95rem; }
.score-player-hcp { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--muted); }
.score-stroke-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--gold-bright); background: var(--gold-dim); border-radius: 4px; padding: 1px 5px; }
.score-adj { display: flex; align-items: center; gap: 6px; }
.sc-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; color: var(--white); width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sc-btn:hover { border-color: var(--gold); }
.sc-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--white); min-width: 32px; text-align: center; }
.sc-val.eagle { color: #f0e68c; }
.sc-val.birdie { color: var(--gold-bright); }
.sc-val.par { color: var(--white); }
.sc-val.bogey { color: #ff9944; }
.sc-val.double { color: var(--red-text); }
.sc-val.worse { color: #cc0000; }
.sc-net { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--green-text); min-width: 36px; text-align: right; }
.hole-result-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
.hole-result-row { display: flex; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; padding: 3px 0; }
.hole-result-row .label { color: var(--muted); }
.press-btn { background: var(--blue-dim); border: 1px solid var(--blue); border-radius: 6px; color: var(--blue-text); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; padding: 5px 12px; cursor: pointer; }
.press-btn:hover { background: var(--blue); color: var(--white); }

/* ── LEADERBOARD / RESULTS ── */
.lb-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.lb-card-header { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 8px 14px; font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; letter-spacing: 0.1em; color: var(--gold); }
.lb-row { display: flex; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); gap: 8px; }
.lb-row:last-child { border-bottom: none; }
.lb-rank { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--muted); width: 22px; flex-shrink: 0; }
.lb-rank.gold { color: var(--gold-bright); }
.lb-name { flex: 1; font-weight: 600; font-size: 0.9rem; }
.lb-detail { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--muted); }
.lb-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; }
.lb-val.pos { color: var(--green-text); }
.lb-val.neg { color: var(--red-text); }
.lb-val.zero { color: var(--muted); }
.lb-val.blue { color: var(--blue-text); }
.match-status { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.06em; }
.match-status.up { color: var(--green-text); }
.match-status.down { color: var(--red-text); }
.match-status.even { color: var(--muted); }
.nassau-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.nassau-header { background: var(--surface2); padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.nassau-header-title { font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem; letter-spacing: 0.08em; color: var(--gold); }
.nassau-header-bet { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
.nassau-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.nassau-row:last-child { border-bottom: none; }
.nassau-bet-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
.stat-strip { display: flex; justify-content: space-around; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
.stat-item { text-align: center; }
.stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--white); }
.stat-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

/* ── WOLF (inline) ── */
.wolf-player-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; transition: all 0.15s; user-select: none; margin-bottom: 8px; }
.wolf-player-card.winner { background: var(--green-dim); border-color: var(--green-text); }
.wolf-player-card.loser { background: var(--red-dim); border-color: var(--red-text); }
.wolf-player-card.push { background: var(--surface2); border-color: var(--muted); }
.wolf-player-card .pname { font-size: 1.05rem; font-weight: 600; }
.wolf-player-card.winner .pname { color: var(--green-text); }
.wolf-player-card.loser .pname { color: var(--red-text); }
.wolf-player-card.push .pname { color: var(--muted); }
.wolf-status-badge { font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem; letter-spacing: 0.1em; padding: 4px 12px; border-radius: 5px; }
.wolf-player-card.winner .wolf-status-badge { background: var(--green); color: var(--white); }
.wolf-player-card.loser .wolf-status-badge { background: var(--red); color: var(--white); }
.wolf-player-card.push .wolf-status-badge { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
.wolf-preview { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; line-height: 1.7; }
.wolf-preview .ml { color: var(--white); }
.wolf-preview .ml.g { color: var(--green-text); }
.wolf-preview .ml.r { color: var(--red-text); }
.bet-adjuster { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.bet-adj-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }
.adj-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--white); width: 28px; height: 28px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.adj-btn:hover { border-color: var(--gold); }
.bet-dinput { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--gold-bright); background: none; border: none; border-bottom: 1px solid var(--gold); width: 52px; text-align: center; outline: none; -moz-appearance: textfield; }
.bet-dinput::-webkit-outer-spin-button, .bet-dinput::-webkit-inner-spin-button { -webkit-appearance: none; }

/* ── TOAST ── */
.toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--gold); border-radius: 8px; color: var(--gold-bright); font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; padding: 10px 20px; z-index: 200; white-space: nowrap; animation: toast-in 0.2s ease; pointer-events: none; }
@keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ═══════════════════════════════════════════
// SJCC COURSE DATA
// ═══════════════════════════════════════════
const SJCC = {
  name: 'San Jose Country Club',
  holes: [
    {num:1,  par:4, hcp:14, yds:295},
    {num:2,  par:4, hcp:10, yds:313},
    {num:3,  par:3, hcp:8,  yds:171},
    {num:4,  par:4, hcp:2,  yds:446},
    {num:5,  par:3, hcp:18, yds:145},
    {num:6,  par:4, hcp:6,  yds:386},
    {num:7,  par:3, hcp:16, yds:156},
    {num:8,  par:4, hcp:4,  yds:435},
    {num:9,  par:4, hcp:12, yds:360},
    {num:10, par:3, hcp:9,  yds:209},
    {num:11, par:5, hcp:17, yds:474},
    {num:12, par:4, hcp:1,  yds:445},
    {num:13, par:4, hcp:5,  yds:411},
    {num:14, par:3, hcp:15, yds:169},
    {num:15, par:4, hcp:13, yds:368},
    {num:16, par:5, hcp:3,  yds:534},
    {num:17, par:5, hcp:11, yds:514},
    {num:18, par:4, hcp:7,  yds:363},
  ]
};

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const SK = 'tbd_scoring_v1';
function loadState() { try { return JSON.parse(localStorage.getItem(SK)) || null; } catch { return null; } }
function saveState() { localStorage.setItem(SK, JSON.stringify(state)); }

let state = loadState() || { screen: 'home' };

// ═══════════════════════════════════════════
// HANDICAP HELPERS
// ═══════════════════════════════════════════
// Returns number of strokes a player gets on a specific hole
function strokesOnHole(playerHcp, holeHcp, hcpPct = 100) {
  const adjHcp = Math.round(playerHcp * hcpPct / 100);
  if (adjHcp <= 0) return 0;
  if (adjHcp >= 18) {
    return adjHcp >= 18 + holeHcp ? 2 : 1;
  }
  return holeHcp <= adjHcp ? 1 : 0;
}

function netScore(gross, playerHcp, holeHcp, hcpPct = 100) {
  return gross - strokesOnHole(playerHcp, holeHcp, hcpPct);
}

function scoreLabel(gross, par) {
  const d = gross - par;
  if (d <= -2) return 'eagle';
  if (d === -1) return 'birdie';
  if (d === 0)  return 'par';
  if (d === 1)  return 'bogey';
  if (d === 2)  return 'double';
  return 'worse';
}

// ═══════════════════════════════════════════
// NASSAU HELPERS
// ═══════════════════════════════════════════
function computeNassauState(ns) {
  // ns = nassau setup object, state.ns
  // Returns match status for front, back, overall + all active presses
  const scores = state.scores || {};
  const ng = state.nsGame || {};
  ns.presses = ng.presses || [];
  const { teamA, teamB, format, hcpPct } = ns;
  const result = { front: null, back: null, overall: null, presses: [] };

  function bestBallHole(team, holeIdx) {
    const hole = SJCC.holes[holeIdx];
    // Only count hole if ALL team members have scores entered
    const grosses = team.map(p => scores[p] && scores[p][holeIdx] != null ? scores[p][holeIdx] : null);
    if (grosses.some(g => g === null)) return null;
    if (format === 'match') {
      const nets = team.map((p, i) => {
        const pObj = state.players.find(pl => pl.name === p);
        return netScore(grosses[i], pObj ? pObj.hcp : 0, hole.hcp, hcpPct);
      });
      return Math.min(...nets);
    } else {
      const nets = team.map((p, i) => {
        const pObj = state.players.find(pl => pl.name === p);
        return netScore(grosses[i], pObj ? pObj.hcp : 0, hole.hcp, hcpPct);
      });
      return Math.min(...nets);
    }
  }

  function resolveMatch(startHole, endHole) {
    // Returns {aWins, bWins, holesPlayed, status, result}
    let aWins = 0, bWins = 0, holesPlayed = 0;
    for (let i = startHole; i <= endHole; i++) {
      const a = bestBallHole(teamA, i);
      const b = bestBallHole(teamB, i);
      if (a === null || b === null) break;
      holesPlayed++;
      if (a < b) aWins++;
      else if (b < a) bWins++;
    }
    const remaining = endHole - startHole + 1 - holesPlayed;
    const diff = aWins - bWins;
    let status = '';
    if (diff === 0) status = 'AS';
    else if (diff > 0) status = `A ${diff}UP`;
    else status = `B ${Math.abs(diff)}UP`;
    // Determine if closed out
    let closed = false;
    if (Math.abs(diff) > remaining && holesPlayed > 0) closed = true;
    return { aWins, bWins, holesPlayed, diff, status, closed, remaining };
  }

  result.front = resolveMatch(0, 8);
  result.back   = resolveMatch(9, 17);
  result.overall = resolveMatch(0, 17);

  // Presses
  result.presses = (ns.presses || []).map(pr => {
    const end = pr.endHole != null ? pr.endHole : (pr.segment === 'front' ? 8 : 17);
    return { ...pr, match: resolveMatch(pr.startHole, end) };
  });

  return result;
}

function nassauPayout(ns, nassauResult) {
  const bet = ns.bet || 0;
  function dollarResult(match, betAmt) {
    if (match.holesPlayed === 0) return null;
    if (match.diff === 0) return { a: 0, b: 0, label: 'Push' };
    if (match.diff > 0) return { a: betAmt, b: -betAmt, label: `A wins $${betAmt}` };
    return { a: -betAmt, b: betAmt, label: `B wins $${betAmt}` };
  }
  const results = [];
  if (ns.betFront) results.push({ name: 'Front 9', ...dollarResult(nassauResult.front, ns.betFront) });
  if (ns.betBack)  results.push({ name: 'Back 9',  ...dollarResult(nassauResult.back,  ns.betBack) });
  if (ns.betTotal) results.push({ name: 'Overall', ...dollarResult(nassauResult.overall, ns.betTotal) });
  nassauResult.presses.forEach((pr, i) => {
    results.push({ name: `Press ${i+1} (H${pr.startHole+1}+)`, ...dollarResult(pr.match, pr.bet || bet) });
  });
  return results;
}

// ═══════════════════════════════════════════
// SKINS HELPERS
// ═══════════════════════════════════════════
function computeSkinsState(ss) {
  const scores = state.scores || {};
  const players = state.players || [];
  const hcpPct = ss.hcpPct || 100;
  const carryover = ss.carryover || false;
  const skinType = ss.skinType || 'net'; // net | gross | canadian

  let skins = []; // per hole: { winner: name|null, carried: bool, pot: number }
  let carryPot = 1;

  for (let hi = 0; hi < 18; hi++) {
    const hole = SJCC.holes[hi];
    const holeScores = players.map(p => {
      const g = scores[p.name] && scores[p.name][hi] != null ? scores[p.name][hi] : null;
      if (g === null) return null;
      const strokes = strokesOnHole(p.hcp, hole.hcp, hcpPct);
      return { name: p.name, gross: g, net: g - strokes, strokes };
    });

    if (holeScores.some(s => s === null)) {
      skins.push({ hole: hi+1, winner: null, pot: carryPot, pending: true, carried: carryPot > 1 });
      continue;
    }

    let winner = null;

    if (skinType === 'gross') {
      const minGross = Math.min(...holeScores.map(s => s.gross));
      const grossWinners = holeScores.filter(s => s.gross === minGross);
      if (grossWinners.length === 1) winner = grossWinners[0].name;
    } else if (skinType === 'net') {
      const minNet = Math.min(...holeScores.map(s => s.net));
      const netWinners = holeScores.filter(s => s.net === minNet);
      if (netWinners.length === 1) winner = netWinners[0].name;
    } else if (skinType === 'canadian') {
      // Gross birdie or better always beats net birdie
      // Best gross score wins; tiebreaker is net
      const minGross = Math.min(...holeScores.map(s => s.gross));
      const par = hole.par;
      const grossBirdieOrBetter = holeScores.filter(s => s.gross <= par - 1);

      if (grossBirdieOrBetter.length === 1) {
        winner = grossBirdieOrBetter[0].name;
      } else if (grossBirdieOrBetter.length > 1) {
        // Tiebreaker: net
        const minNet = Math.min(...grossBirdieOrBetter.map(s => s.net));
        const netWinners = grossBirdieOrBetter.filter(s => s.net === minNet);
        winner = netWinners.length === 1 ? netWinners[0].name : null; // push if still tied
      } else {
        // No gross birdie — best net wins
        const minNet = Math.min(...holeScores.map(s => s.net));
        const netWinners = holeScores.filter(s => s.net === minNet);
        if (netWinners.length === 1) winner = netWinners[0].name;
      }
    }

    if (winner) {
      skins.push({ hole: hi+1, winner, pot: carryPot, carried: carryPot > 1 });
      carryPot = carryover ? 1 : 1;
      if (carryover) carryPot = 1;
    } else {
      skins.push({ hole: hi+1, winner: null, pot: carryover ? carryPot + 1 : carryPot, carried: carryPot > 1, push: true });
      if (carryover) carryPot++;
    }
  }
  return skins;
}

function skinsTotals(skinsState, skinBet, players) {
  const totals = {};
  players.forEach(p => totals[p.name] = 0);
  const winners = skinsState.filter(s => s.winner);
  const totalSkinners = winners.length;
  if (totalSkinners === 0) return totals;

  skinsState.forEach(s => {
    if (!s.winner) return;
    const loserCount = players.length - 1;
    const pot = loserCount * skinBet * s.pot;
    totals[s.winner] += pot;
    players.forEach(p => { if (p.name !== s.winner) totals[p.name] -= skinBet * s.pot; });
  });
  return totals;
}

function wolfHoleResult(bet, statuses, players) {
  const winners = players.filter(p => statuses[p]==='winner');
  const losers  = players.filter(p => statuses[p]==='loser');
  const results = {};
  players.forEach(p => results[p] = 0);
  if (winners.length > 0 && losers.length > 0) {
    const pot = losers.length * bet;
    const winEach = pot / winners.length;
    winners.forEach(p => results[p] = winEach);
    losers.forEach(p  => results[p] = -bet);
  }
  return results;
}

  if (ns.skins)  tabs.push('Skins');
  tabs.push('Summary');

  return `<div class="top-bar"><span class="top-bar-title">⛳ ${SJCC.name.toUpperCase()}</span>
    <div style="display:flex;gap:6px">
      <button class="back-btn" id="ns-end-round" style="color:var(--red-text);border-color:var(--red)">End</button>
      <button class="back-btn" id="go-home">Home</button>
    </div>
  </div>
  <div class="tabs">${tabs.map(t=>`<button class="tab ${tab.toLowerCase()===t.toLowerCase()?'active':''}" data-ns-tab="${t.toLowerCase()}">${t}</button>`).join('')}</div>
  <div class="tab-content">
    ${tab==='scorecard' ? renderNSScorecard() : ''}
    ${tab==='nassau'    ? renderNSNassau()    : ''}
    ${tab==='skins'     ? renderNSSkins()     : ''}
    ${tab==='summary'   ? renderNSSummary()   : ''}
  </div>`;
}

function renderNSScorecard() {
  const ng = state.nsGame;
  const ns = state.nsSetup;
  const hi = ng.currentHole; // 0-indexed
  const hole = SJCC.holes[hi];
  const players = state.players;

  const scoreRows = players.map(p => {
    const gross = (state.scores[p.name] || {})[hi];
    const strokes = strokesOnHole(p.hcp, hole.hcp, ns.hcpPct);
    const hasScore = gross != null;
    const net = hasScore ? gross - strokes : null;
    const slabel = hasScore ? scoreLabel(gross, hole.par) : '';

    return `<div class="score-row">
      <div style="flex:1">
        <div class="score-player-name">${p.name}</div>
        <div style="display:flex;gap:6px;margin-top:2px">
          <span class="score-player-hcp">Hcp ${p.hcp}</span>
          ${strokes > 0 ? `<span class="score-stroke-badge">+${strokes} stroke${strokes>1?'s':''}</span>` : ''}
        </div>
      </div>
      <div class="score-adj">
        <button class="sc-btn" data-sc-down="${p.name}">−</button>
        <div class="sc-val ${slabel}">${hasScore ? gross : '–'}</div>
        <button class="sc-btn" data-sc-up="${p.name}">+</button>
      </div>
      <div class="sc-net">${net != null ? `net ${net}` : ''}</div>
    </div>`;
  }).join('');

  // Nassau live status snippet
  let nassauSnip = '';
  if (ns.nassau) {
    const nr = computeNassauState(ns);
    const seg = hi < 9 ? 'front' : 'back';
    const match = seg === 'front' ? nr.front : nr.back;
    const aNames = ns.teamA.join('/');
    const bNames = ns.teamB.join('/');
    const thru = match.holesPlayed;
    const matchStatusColor = match.diff===0?'var(--muted)':match.diff>0?'var(--blue-text)':'var(--purple-text)';
    const matchStatusText = thru === 0 ? 'No scores yet' : match.status;
    const aLabel = ns.teamA.join('/');
    const bLabel = ns.teamB.join('/');
    nassauSnip = `<div class="hole-result-box" style="margin-bottom:10px">
      <div class="hole-result-row"><span class="label">${seg === 'front' ? 'Front' : 'Back'} · Thru ${thru}</span>
        <span style="font-family:'Bebas Neue',sans-serif;font-size:1rem;color:${matchStatusColor}">${matchStatusText}</span>
      </div>
      <div class="hole-result-row" style="font-size:0.7rem">
        <span style="color:var(--blue-text)">${aLabel}</span>
        <span style="color:var(--muted)">vs</span>
        <span style="color:var(--purple-text)">${bLabel}</span>
      </div>
      ${ns.autoPress ? `<div class="hole-result-row"><span class="label">Auto press</span><span style="color:var(--muted);font-size:0.72rem">triggers at 2-down</span></div>` : ''}
      <div style="margin-top:6px"><button class="press-btn" id="ns-manual-press">+ Manual Press</button></div>
    </div>`;
  }

  const canGoPrev = hi > 0;
  const canGoNext = hi < 17;

  return `<div>
    <div class="hole-nav">
      <div>
        <div class="hole-nav-title">Hole ${hole.num}</div>
        <div class="hole-nav-sub">${SJCC.name}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="back-btn" id="sc-prev" ${canGoPrev?'':'disabled'}>← Prev</button>
        <button class="back-btn" id="sc-next" ${canGoNext?'':'disabled'}>Next →</button>
      </div>
    </div>
    <div class="hole-meta">
      <div class="hole-meta-item">Par <span>${hole.par}</span></div>
      <div class="hole-meta-item">Yds <span>${hole.yds}</span></div>
      <div class="hole-meta-item">Hcp <span>${hole.hcp}</span></div>
    </div>
    <div class="score-entry">${scoreRows}</div>
    ${nassauSnip}
  </div>`;
}

function renderNSNassau() {
  const ns = state.nsSetup;
  const nr = computeNassauState(ns);
  const payouts = nassauPayout(ns, nr);
  const aNames = ns.teamA.join(' / ');
  const bNames = ns.teamB.join(' / ');

  function statusColor(diff) {
    if (diff === 0) return 'var(--muted)';
    return diff > 0 ? 'var(--blue-text)' : 'var(--purple-text)';
  }
  function matchRow(label, match, bet) {
    return `<div class="nassau-row">
      <div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:0.8rem;color:var(--white)">${label}</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--muted)">${match.holesPlayed} holes played · $${bet}</div>
      </div>
      <span style="font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:${statusColor(match.diff)}">${match.status}</span>
    </div>`;
  }

  let pressRows = '';
  if (nr.presses.length > 0) {
    pressRows = nr.presses.map((pr, i) =>
      matchRow(`Press ${i+1} (H${pr.startHole+1}+)`, pr.match, pr.bet || ns.betFront)
    ).join('');
  }

  let payoutRows = payouts.map(p => {
    if (!p || p.a === undefined) return '';
    const winner = p.a > 0 ? `Team A (+$${fmt(p.a)})` : p.b > 0 ? `Team B (+$${fmt(p.b)})` : 'Push';
    return `<div class="hole-result-row"><span class="label">${p.name}</span>
      <span style="color:${p.a===0?'var(--muted)':p.a>0?'var(--blue-text)':'var(--purple-text)'}">${p.label||winner}</span>
    </div>`;
  }).join('');

  return `<div>
    <div class="stat-strip">
      <div class="stat-item"><div class="stat-val" style="color:var(--blue-text)">${aNames}</div><div class="stat-lbl">Team A</div></div>
      <div class="stat-item"><div class="stat-val" style="color:var(--purple-text)">${bNames}</div><div class="stat-lbl">Team B</div></div>
    </div>
    <div class="nassau-section">
      <div class="nassau-header"><span class="nassau-header-title">Match Status</span></div>
      ${matchRow('Front 9', nr.front, ns.betFront)}
      ${matchRow('Back 9', nr.back, ns.betBack)}
      ${matchRow('Overall', nr.overall, ns.betTotal)}
      ${pressRows}
    </div>
    ${payoutRows ? `<div class="card"><div style="font-family:'Bebas Neue',sans-serif;font-size:0.9rem;letter-spacing:0.08em;color:var(--gold);margin-bottom:8px">Current Payouts</div>
      <div class="hole-result-box" style="margin:0">${payoutRows}</div></div>` : ''}
    <button class="big-btn ghost" id="ns-manual-press" style="margin-top:4px">+ Add Manual Press</button>
  </div>`;
}

function renderNSSkins() {
  const ns = state.nsSetup;
  const skinsState = computeSkinsState(ns);
  const totals = skinsTotals(skinsState, ns.skinBet, state.players);
  const sorted = [...state.players].sort((a,b) => totals[b.name] - totals[a.name]);

  const skinTypeLabel = ns.skinType === 'canadian' ? '🍁 Canadian' : ns.skinType === 'gross' ? 'Gross' : 'Net';

  const lbRows = sorted.map((p, i) => {
    const net = totals[p.name];
    const cls = net>0?'pos':net<0?'neg':'zero';
    const sign = net>0?'+':'';
    const won = skinsState.filter(s=>s.winner===p.name).length;
    return `<div class="lb-row ${i===0&&net>0?'':''}">
      <span class="lb-rank ${i===0&&net>0?'gold':''}">${i===0&&net>0?'★':i+1}</span>
      <span class="lb-name">${p.name}</span>
      <span class="lb-detail">${won} skin${won!==1?'s':''}</span>
      <span class="lb-val ${cls}">${sign}$${fmt(Math.abs(net))}</span>
    </div>`;
  }).join('');

  const holeRows = skinsState.map(s => {
    const hole = SJCC.holes[s.hole-1];
    if (s.pending) return `<div class="hole-result-row" style="padding:5px 0"><span class="label" style="color:var(--muted)">Hole ${s.hole} (Par ${hole.par})</span><span class="chip gray">Pending${s.carried?' · Carried':''}${s.pot>1?' · '+s.pot+'x':''}</span></div>`;
    if (s.push) return `<div class="hole-result-row" style="padding:5px 0"><span class="label" style="color:var(--muted)">Hole ${s.hole} (Par ${hole.par})</span><span class="chip gray">Push${ns.carryover?' → Carries':''}</span></div>`;
    return `<div class="hole-result-row" style="padding:5px 0"><span class="label" style="color:var(--muted)">Hole ${s.hole} (Par ${hole.par})</span>
      <span class="chip green">${s.winner}${s.carried?' ('+s.pot+'x)':''}</span></div>`;
  }).join('');

  return `<div>
    <div class="stat-strip">
      <div class="stat-item"><div class="stat-val">${skinTypeLabel}</div><div class="stat-lbl">Format</div></div>
      <div class="stat-item"><div class="stat-val">$${ns.skinBet}</div><div class="stat-lbl">Per Skin</div></div>
      <div class="stat-item"><div class="stat-val">${ns.carryover?'Yes':'No'}</div><div class="stat-lbl">Carryover</div></div>
    </div>
    <div class="lb-card"><div class="lb-card-header">Skins Leaderboard</div>${lbRows}</div>
    <div class="card"><div style="font-family:'Bebas Neue',sans-serif;font-size:0.9rem;letter-spacing:0.08em;color:var(--gold);margin-bottom:8px">Hole by Hole</div>
      ${holeRows}
    </div>
  </div>`;
}

function renderNSSummary() {
  const ns = state.nsSetup;
  const totals = {};
  state.players.forEach(p => totals[p.name] = 0);

  // Add skins
  if (ns.skins) {
    const sk = skinsTotals(computeSkinsState(ns), ns.skinBet, state.players);
    state.players.forEach(p => totals[p.name] += sk[p.name] || 0);
  }

  // Add nassau
  if (ns.nassau) {
    const nr = computeNassauState(ns);
    const payouts = nassauPayout(ns, nr);
    payouts.forEach(po => {
      if (!po || po.a === undefined) return;
      ns.teamA.forEach(n => totals[n] = (totals[n]||0) + (po.a / ns.teamA.length));
      ns.teamB.forEach(n => totals[n] = (totals[n]||0) + (po.b / ns.teamB.length));
    });
  }

  const sorted = [...state.players].sort((a,b) => totals[b.name] - totals[a.name]);
  const rows = sorted.map((p, i) => {
    const net = totals[p.name];
    const cls = net>0?'pos':net<0?'neg':'zero';
    const sign = net>0?'+':'';
    return `<div class="lb-row">
      <span class="lb-rank ${i===0?'gold':''}">${i===0?'★':i+1}</span>
      <span class="lb-name">${p.name}</span>
      <span class="lb-val ${cls}" style="font-size:1.5rem">${sign}$${fmt(Math.abs(net))}</span>
    </div>`;
  }).join('');

  const holesPlayed = Object.values(state.scores[state.players[0]?.name] || {}).filter(v=>v!=null).length;

  return `<div>
    <div class="stat-strip">
      <div class="stat-item"><div class="stat-val">${holesPlayed}</div><div class="stat-lbl">Holes</div></div>
      <div class="stat-item"><div class="stat-val">${SJCC.holes.slice(0,holesPlayed).reduce((s,h)=>s+h.par,0)}</div><div class="stat-lbl">Par</div></div>
      <div class="stat-item"><div class="stat-val">${state.players.length}</div><div class="stat-lbl">Players</div></div>
    </div>
    <div class="lb-card"><div class="lb-card-header">Net Totals</div>${rows}</div>
    <button class="big-btn green" id="ns-new-round">New Round</button>
    <button class="big-btn ghost" id="ns-back-to-game">← Back to Round</button>
  </div>`;
}

// UTILITIES
// ═══════════════════════════════════════════
function fmt(n) { return n % 1 === 0 ? n : n.toFixed(2); }

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 2500);
}

function attachEvents() {
  const s = state.screen;
  // Universal
  document.getElementById('go-home')?.addEventListener('click', () => { state.screen = 'home'; render(); });

  if (s === 'home')      attachHomeEvents();
  if (s === 'wolf-setup') attachWolfSetupEvents();
  if (s === 'wolf-game')  attachWolfGameEvents();
  if (s === 'ns-setup')   attachNSSetupEvents();
  if (s === 'ns-game')    attachNSGameEvents();
}

function attachHomeEvents() {
  document.getElementById('home-wolf')?.addEventListener('click', () => { state.screen = 'wolf-setup'; render(); });
  document.getElementById('home-ns')?.addEventListener('click',   () => { state.screen = 'ns-setup';   render(); });
  document.getElementById('resume-wolf')?.addEventListener('click', () => { state.screen = 'wolf-game'; render(); });
  document.getElementById('resume-ns')?.addEventListener('click',   () => { state.screen = 'ns-game';   render(); });
}

function attachWolfSetupEvents() {
  document.querySelectorAll('.wolf-pname').forEach(inp => {
    inp.addEventListener('input', e => { state.wolf.players[parseInt(e.target.dataset.idx)] = e.target.value; });
    inp.addEventListener('blur', () => render());
  });
  document.querySelectorAll('[data-wolf-remove]').forEach(btn => {
    btn.addEventListener('click', e => { state.wolf.players.splice(parseInt(e.target.dataset.wolfRemove),1); render(); });
  });
  document.getElementById('wolf-add-player')?.addEventListener('click', () => { state.wolf.players.push(''); render(); });
  document.getElementById('wolf-default-bet')?.addEventListener('input', e => { state.wolf.defaultBet = parseFloat(e.target.value)||5; });
  document.getElementById('wolf-start')?.addEventListener('click', () => {
    state.wolf.players = state.wolf.players.map((p,i)=>p.trim()||`Player ${i+1}`);
    state.wolfGame = {
      tab: 'play', holes: [], currentHole: 1, editingHole: null,
      holeInput: { bet: state.wolf.defaultBet, statuses: {} }
    };
    state.wolf.players.forEach(p => state.wolfGame.holeInput.statuses[p] = 'push');
    state.wolfSaved = true;
    state.screen = 'wolf-game';
    render();
  });
}

function attachWolfGameEvents() {
  const wg = state.wolfGame;
  document.querySelectorAll('[data-wolf-tab]').forEach(t => {
    t.addEventListener('click', e => { wg.tab = e.target.dataset.wolfTab; render(); });
  });
  document.getElementById('wolf-end-round')?.addEventListener('click', () => {
    state.wolfSaved = false; state.screen = 'home'; render();
  });

  // Bet
  const betInput = document.getElementById('wolf-bet-input');
  betInput?.addEventListener('input', e => { const v=parseInt(e.target.value); if(!isNaN(v)&&v>=1) wg.holeInput.bet=v; });
  betInput?.addEventListener('blur', ()=>render());
  document.getElementById('wolf-bet-up')?.addEventListener('click', ()=>{ wg.holeInput.bet=Math.max(1,wg.holeInput.bet+1); render(); });
  document.getElementById('wolf-bet-down')?.addEventListener('click', ()=>{ wg.holeInput.bet=Math.max(1,wg.holeInput.bet-1); render(); });

  // Player cards
  document.querySelectorAll('[data-wolf-player]').forEach(card => {
    card.addEventListener('click', () => {
      const p = card.dataset.wolfPlayer;
      const cur = wg.holeInput.statuses[p] || 'push';
      const cycle = { push:'winner', winner:'loser', loser:'push' };
      wg.holeInput.statuses[p] = cycle[cur];
      render();
    });
  });

  // Confirm
  document.getElementById('wolf-confirm-hole')?.addEventListener('click', () => {
    const hi = wg.holeInput;
    const results = wolfHoleResult(hi.bet, hi.statuses, state.wolf.players);
    wg.holes.push({ num: wg.currentHole, bet: hi.bet, statuses: {...hi.statuses}, results });
    wg.currentHole++;
    wg.holeInput = { bet: state.wolf.defaultBet, statuses: {} };
    state.wolf.players.forEach(p => wg.holeInput.statuses[p] = 'push');
    render();
  });

  // Prev holes edit
  document.querySelectorAll('[data-wolf-edit]').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.wolfEdit);
      wg.editingHole = idx;
      const h = wg.holes[idx];
      wg.holeInput = { bet: h.bet, statuses: {...h.statuses} };
      render();
    });
  });

  // Modal
  if (wg.editingHole != null) {
    document.getElementById('wolf-modal-cancel')?.addEventListener('click', () => {
      wg.editingHole = null;
      wg.holeInput = { bet: state.wolf.defaultBet, statuses: {} };
      state.wolf.players.forEach(p => wg.holeInput.statuses[p] = 'push');
      render();
    });
    document.getElementById('wolf-modal-overlay')?.addEventListener('click', e => {
      if (e.target.id==='wolf-modal-overlay') {
        wg.editingHole=null; wg.holeInput={bet:state.wolf.defaultBet,statuses:{}};
        state.wolf.players.forEach(p=>wg.holeInput.statuses[p]='push'); render();
      }
    });
    document.getElementById('wolf-modal-save')?.addEventListener('click', () => {
      const hi = wg.holeInput;
      wg.holes[wg.editingHole] = { ...wg.holes[wg.editingHole], bet:hi.bet, statuses:{...hi.statuses}, results:wolfHoleResult(hi.bet,hi.statuses,state.wolf.players) };
      wg.editingHole=null; wg.holeInput={bet:state.wolf.defaultBet,statuses:{}};
      state.wolf.players.forEach(p=>wg.holeInput.statuses[p]='push'); render();
    });
  }
}

function attachNSSetupEvents() {
  const ns = state.nsSetup;
  document.querySelectorAll('.ns-pname').forEach(inp => {
    inp.addEventListener('input', e => { ns.players[parseInt(e.target.dataset.idx)].name = e.target.value; });
    inp.addEventListener('blur', () => render());
  });
  document.querySelectorAll('.ns-hcp').forEach(inp => {
    inp.addEventListener('input', e => { ns.players[parseInt(e.target.dataset.idx)].hcp = parseFloat(e.target.value)||0; });
  });
  document.querySelectorAll('[data-ns-remove]').forEach(btn => {
    btn.addEventListener('click', e => { ns.players.splice(parseInt(e.target.dataset.nsRemove),1); render(); });
  });
  document.getElementById('ns-add-player')?.addEventListener('click', () => { ns.players.push({name:'',hcp:0}); render(); });
  document.getElementById('ns-hcp-pct')?.addEventListener('input', e => { ns.hcpPct=parseFloat(e.target.value)||100; });
  document.getElementById('ns-nassau-toggle')?.addEventListener('change', e => { ns.nassau=e.target.checked; render(); });
  document.getElementById('ns-skins-toggle')?.addEventListener('change', e => { ns.skins=e.target.checked; render(); });
  document.getElementById('ns-auto-press')?.addEventListener('change', e => { ns.autoPress=e.target.checked; });
  document.getElementById('ns-carryover')?.addEventListener('change', e => { ns.carryover=e.target.checked; render(); });
  document.getElementById('ns-bet-front')?.addEventListener('input', e => { ns.betFront=parseFloat(e.target.value)||0; });
  document.getElementById('ns-bet-back')?.addEventListener('input', e => { ns.betBack=parseFloat(e.target.value)||0; });
  document.getElementById('ns-bet-total')?.addEventListener('input', e => { ns.betTotal=parseFloat(e.target.value)||0; });
  document.getElementById('ns-skin-bet')?.addEventListener('input', e => { ns.skinBet=parseFloat(e.target.value)||1; });
  document.querySelectorAll('[data-nassau-format]').forEach(btn => {
    btn.addEventListener('click', e => { ns.nassauFormat=e.target.dataset.nassauFormat; render(); });
  });
  document.querySelectorAll('[data-skin-type]').forEach(btn => {
    btn.addEventListener('click', e => { ns.skinType=e.target.dataset.skinType; render(); });
  });
  // Team assignment
  document.querySelectorAll('[data-team]').forEach(btn => {
    btn.addEventListener('click', e => {
      const team = e.target.dataset.team;
      const player = e.target.dataset.player;
      if (team==='A') {
        ns.teamA = [...new Set([...ns.teamA, player])];
        ns.teamB = ns.teamB.filter(p=>p!==player);
      } else {
        ns.teamB = [...new Set([...ns.teamB, player])];
        ns.teamA = ns.teamA.filter(p=>p!==player);
      }
      render();
    });
  });

  document.getElementById('ns-start')?.addEventListener('click', () => {
    // Validate
    ns.players = ns.players.map((p,i)=>({...p, name:p.name.trim()||`Player ${i+1}`}));
    if (!ns.nassau && !ns.skins) { alert('Enable Nassau, Skins, or both.'); return; }
    if (ns.nassau && (ns.teamA.length===0||ns.teamB.length===0)) { alert('Assign players to both teams for Nassau.'); return; }

    // Init scores object
    const scores = {};
    ns.players.forEach(p => { scores[p.name] = {}; });

    state.players = ns.players;
    state.scores = scores;
    state.nsGame = {
      tab: 'scorecard',
      currentHole: 0,
      presses: [],
    };
    state.nsSaved = true;
    state.screen = 'ns-game';
    render();
  });
}

function attachNSGameEvents() {
  const ng = state.nsGame;
  const ns = state.nsSetup;

  document.querySelectorAll('[data-ns-tab]').forEach(t => {
    t.addEventListener('click', e => { ng.tab = e.target.dataset.nsTab; render(); });
  });
  document.getElementById('ns-end-round')?.addEventListener('click', () => { state.nsSaved=false; state.screen='home'; render(); });
  document.getElementById('sc-prev')?.addEventListener('click', () => { if(ng.currentHole>0){ng.currentHole--; render();} });
  document.getElementById('sc-next')?.addEventListener('click', () => { if(ng.currentHole<17){ng.currentHole++; render();} });

  // Score adjusters
  document.querySelectorAll('[data-sc-up]').forEach(btn => {
    btn.addEventListener('click', e => {
      const p = e.target.dataset.scUp;
      const hi = ng.currentHole;
      if (!state.scores[p]) state.scores[p] = {};
      const par = SJCC.holes[hi].par;
      state.scores[p][hi] = (state.scores[p][hi] != null ? state.scores[p][hi] : par - 1) + 1;
      checkAutoPress(hi);
      render();
    });
  });
  document.querySelectorAll('[data-sc-down]').forEach(btn => {
    btn.addEventListener('click', e => {
      const p = e.target.dataset.scDown;
      const hi = ng.currentHole;
      if (!state.scores[p]) state.scores[p] = {};
      const par = SJCC.holes[hi].par;
      const cur = state.scores[p][hi] != null ? state.scores[p][hi] : par + 1;
      state.scores[p][hi] = Math.max(1, cur - 1);
      checkAutoPress(hi);
      render();
    });
  });

  // Manual press
  document.querySelectorAll('#ns-manual-press').forEach(btn => {
    btn.addEventListener('click', () => {
      const hi = ng.currentHole;
      const seg = hi < 9 ? 'front' : 'back';
      ng.presses = ng.presses || [];
      const pressNum = ng.presses.filter(p => p.manual).length + 1;
      ng.presses.push({ startHole: hi, segment: seg, bet: seg==='front'?ns.betFront:ns.betBack, manual:true });
      ns.presses = ng.presses;
      showToast(`Press #${pressNum} logged — starting hole ${hi + 1}`);
      render();
    });
  });

  document.getElementById('ns-new-round')?.addEventListener('click', () => { state.screen='ns-setup'; state.nsSaved=false; render(); });
  document.getElementById('ns-back-to-game')?.addEventListener('click', () => { ng.tab='scorecard'; render(); });
}

function checkAutoPress(holeIdx) {
  const ns = state.nsSetup;
  if (!ns.nassau || !ns.autoPress) return;
  const ng = state.nsGame;
  ng.presses = ng.presses || [];
  ns.presses = ng.presses;

  const nr = computeNassauState(ns);
  const seg = holeIdx < 9 ? 'front' : 'back';
  const match = seg==='front' ? nr.front : nr.back;

  // Check if 2 down and no press already started at this hole
  if (Math.abs(match.diff) >= 2) {
    const alreadyPressed = ng.presses.some(p => p.startHole === holeIdx+1 && p.segment===seg && !p.manual);
    if (!alreadyPressed && holeIdx+1 <= (seg==='front'?8:17)) {
      ng.presses.push({ startHole: holeIdx+1, segment:seg, bet: seg==='front'?ns.betFront:ns.betBack, auto:true });
      ns.presses = ng.presses;
    }
  }
}

// ── BOOT ──
render();
</script>
</body>
