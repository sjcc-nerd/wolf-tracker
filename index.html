<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Wolf Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --green: #238636;
  --green-bright: #2ea043;
  --green-dim: #1a3a25;
  --green-text: #56d364;
  --red: #b91c1c;
  --red-bright: #da3633;
  --red-dim: #3a1a1a;
  --red-text: #f85149;
  --gray: #30363d;
  --gray-text: #8b949e;
  --gold: #d29922;
  --gold-bright: #e3b341;
  --gold-dim: #2d2007;
  --white: #f0f6fc;
  --muted: #8b949e;
  --radius: 10px;
}

html, body { height: 100%; background: var(--bg); color: var(--white); font-family: 'IBM Plex Sans', sans-serif; overflow: hidden; }

.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; }

/* ── SETUP ── */
.setup { flex: 1; overflow-y: auto; padding: 24px 16px 40px; }
.setup-logo { text-align: center; margin-bottom: 28px; }
.setup-logo h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 0.12em; color: var(--gold-bright); line-height: 1; }
.setup-logo p { color: var(--muted); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }

.section-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 8px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }

.player-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.player-row:last-child { margin-bottom: 0; }
.player-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--gold); width: 22px; flex-shrink: 0; }
.player-row input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; color: var(--white); font-family: 'IBM Plex Sans', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.15s; }
.player-row input:focus { border-color: var(--gold); }
.remove-btn { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 4px 6px; border-radius: 5px; transition: color 0.15s; }
.remove-btn:hover { color: var(--red-text); }

.add-player-btn { width: 100%; background: none; border: 1px dashed var(--border); border-radius: 7px; color: var(--muted); font-family: 'IBM Plex Sans', sans-serif; font-size: 0.85rem; padding: 9px; cursor: pointer; transition: all 0.15s; margin-top: 4px; }
.add-player-btn:hover { border-color: var(--gold); color: var(--gold); }

.bet-row { display: flex; align-items: center; gap: 12px; }
.bet-row label { flex: 1; color: var(--muted); font-size: 0.85rem; }
.bet-input-wrap { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px; }
.bet-input-wrap span { color: var(--gold); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.bet-input-wrap input { background: none; border: none; color: var(--white); font-family: 'IBM Plex Mono', monospace; font-size: 1rem; font-weight: 600; width: 60px; outline: none; text-align: right; }

.start-btn { width: 100%; background: var(--green); border: none; border-radius: var(--radius); color: var(--white); font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.12em; padding: 16px; cursor: pointer; transition: background 0.15s; }
.start-btn:hover { background: var(--green-bright); }
.start-btn:active { transform: scale(0.98); }

/* ── MAIN GAME ── */
.game { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.top-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.top-bar-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.1em; color: var(--gold-bright); }
.end-round-btn { background: var(--red); border: none; border-radius: 6px; color: var(--white); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; padding: 6px 12px; cursor: pointer; transition: background 0.15s; }
.end-round-btn:hover { background: var(--red-bright); }

.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab { flex: 1; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 4px; cursor: pointer; transition: all 0.15s; }
.tab.active { color: var(--gold-bright); border-bottom-color: var(--gold-bright); }

.tab-content { flex: 1; overflow-y: auto; padding: 16px; }

/* ── PLAY TAB ── */
.hole-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.hole-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.08em; color: var(--white); }
.hole-title span { color: var(--muted); font-size: 1rem; }

.bet-adjuster { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.bet-adjuster-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.adj-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--white); width: 28px; height: 28px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
.adj-btn:hover { border-color: var(--gold); color: var(--gold); }
.bet-display { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--gold-bright); min-width: 48px; text-align: center; }
.bet-display-input { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--gold-bright); background: none; border: none; border-bottom: 1px solid var(--gold); width: 56px; text-align: center; outline: none; padding: 0; -moz-appearance: textfield; }
.bet-display-input::-webkit-outer-spin-button, .bet-display-input::-webkit-inner-spin-button { -webkit-appearance: none; }

.players-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

.player-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; transition: all 0.15s; user-select: none; }
.player-card.winner { background: var(--green-dim); border-color: var(--green-text); }
.player-card.loser { background: var(--red-dim); border-color: var(--red-text); }
.player-card.push { background: var(--surface2); border-color: var(--muted); }

.player-card-name { font-size: 1.1rem; font-weight: 600; }
.player-card.winner .player-card-name { color: var(--green-text); }
.player-card.loser .player-card-name { color: var(--red-text); }
.player-card.push .player-card-name { color: var(--muted); }

.player-card-status { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 0.1em; padding: 4px 14px; border-radius: 5px; }
.player-card.winner .player-card-status { background: var(--green); color: var(--white); }
.player-card.loser .player-card-status { background: var(--red); color: var(--white); }
.player-card.push .player-card-status { background: var(--gray); color: var(--muted); }

.hole-preview { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; color: var(--muted); line-height: 1.7; }
.hole-preview .math-line { color: var(--white); }
.hole-preview .math-line.green { color: var(--green-text); }
.hole-preview .math-line.red { color: var(--red-text); }

.confirm-btn { width: 100%; background: var(--gold); border: none; border-radius: var(--radius); color: var(--bg); font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.12em; padding: 16px; cursor: pointer; transition: all 0.15s; }
.confirm-btn:hover { background: var(--gold-bright); }
.confirm-btn:active { transform: scale(0.98); }
.confirm-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

/* ── LEADERBOARD TAB ── */
.lb-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
.lb-row.leader { border-color: var(--gold); }
.lb-rank { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: var(--muted); width: 24px; }
.lb-rank.gold { color: var(--gold-bright); }
.lb-name { flex: 1; font-weight: 600; font-size: 1rem; margin-left: 10px; }
.lb-holes { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); margin-right: 12px; }
.lb-amount { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.04em; }
.lb-amount.pos { color: var(--green-text); }
.lb-amount.neg { color: var(--red-text); }
.lb-amount.zero { color: var(--muted); }

.lb-empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 40px 0; }

/* ── PREVIOUS HOLES TAB ── */
.hole-log-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.hole-log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.hole-log-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--gold); letter-spacing: 0.06em; }
.hole-log-bet { font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--muted); }
.edit-hole-btn { background: none; border: 1px solid var(--border); border-radius: 5px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; padding: 3px 8px; cursor: pointer; transition: all 0.15s; }
.edit-hole-btn:hover { border-color: var(--gold); color: var(--gold); }
.hole-log-players { display: flex; flex-wrap: wrap; gap: 6px; }
.log-chip { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
.log-chip.winner { background: var(--green-dim); color: var(--green-text); border: 1px solid var(--green); }
.log-chip.loser { background: var(--red-dim); color: var(--red-text); border: 1px solid var(--red); }
.log-chip.push { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.hole-log-result { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; }

.prev-empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 40px 0; }

/* ── EDIT MODAL ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; padding: 20px 16px 36px; max-height: 85vh; overflow-y: auto; }
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-save { flex: 1; background: var(--gold); border: none; border-radius: 8px; color: var(--bg); font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.1em; padding: 12px; cursor: pointer; }
.modal-cancel { flex: 1; background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.1em; padding: 12px; cursor: pointer; }

/* ── END ROUND ── */
.end-screen { flex: 1; overflow-y: auto; padding: 24px 16px 40px; }
.end-logo { text-align: center; margin-bottom: 24px; }
.end-logo h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 0.12em; color: var(--gold-bright); }
.end-logo p { color: var(--muted); font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; }
.end-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
.end-row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.end-row:last-child { border-bottom: none; }
.end-row.top-row { background: var(--gold-dim); border-bottom-color: var(--gold); }
.end-pos { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--gold); width: 28px; }
.end-name { flex: 1; font-weight: 600; font-size: 1rem; }
.end-holes { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); margin-right: 12px; text-align: right; }
.end-net { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.04em; }
.end-net.pos { color: var(--green-text); }
.end-net.neg { color: var(--red-text); }
.end-net.zero { color: var(--muted); }
.new-round-btn { width: 100%; background: var(--green); border: none; border-radius: var(--radius); color: var(--white); font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.12em; padding: 16px; cursor: pointer; transition: background 0.15s; margin-bottom: 10px; }
.new-round-btn:hover { background: var(--green-bright); }
.continue-btn { width: 100%; background: none; border: 1px solid var(--border); border-radius: var(--radius); color: var(--muted); font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.1em; padding: 14px; cursor: pointer; transition: all 0.15s; }
.continue-btn:hover { border-color: var(--gold); color: var(--gold); }

.stat-row { display: flex; justify-content: space-around; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 20px; }
.stat-item { text-align: center; }
.stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--white); }
.stat-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ── STATE ──
const STORAGE_KEY = 'wolf_tracker_v1';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; } catch { return null; }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState() || {
  screen: 'setup',   // setup | game | end
  players: [],
  defaultBet: 5,
  holes: [],
  activeTab: 'play',
  currentHole: 1,
  editingHole: null,  // index into holes[] being edited
  // per-hole input in progress
  holeInput: { bet: 5, statuses: {} }
};

// ── RENDER ──
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'setup') app.innerHTML = renderSetup();
  else if (state.screen === 'game') app.innerHTML = renderGame();
  else if (state.screen === 'end') app.innerHTML = renderEnd();
  attachEvents();
  saveState();
}

// ── SETUP ──
function renderSetup() {
  const players = state.players.length ? state.players : ['', '', '', ''];
  if (!state.players.length) state.players = players;

  let playerRows = '';
  players.forEach((name, i) => {
    const canRemove = i >= 4 && players.length > 4;
    playerRows += `
      <div class="player-row" data-pi="${i}">
        <span class="player-num">${i+1}</span>
        <input type="text" class="player-name-input" data-idx="${i}" placeholder="Player ${i+1}" value="${name}" autocomplete="off" />
        ${canRemove ? `<button class="remove-btn" data-remove="${i}">✕</button>` : ''}
      </div>`;
  });

  const canAdd = players.length < 5;

  return `
    <div class="setup">
      <div class="setup-logo">
        <h1>WOLF</h1>
        <p>Golf Money Tracker</p>
      </div>

      <div class="section-label">Players</div>
      <div class="card">
        ${playerRows}
        ${canAdd ? `<button class="add-player-btn" id="add-player-btn">+ Add Player (${players.length}/5)</button>` : ''}
      </div>

      <div class="section-label">Default Bet Per Hole</div>
      <div class="card">
        <div class="bet-row">
          <label>Amount each loser pays per hole</label>
          <div class="bet-input-wrap">
            <span>$</span>
            <input type="number" id="default-bet" value="${state.defaultBet}" min="1" step="1" />
          </div>
        </div>
      </div>

      <button class="start-btn" id="start-btn">Tee It Up →</button>
    </div>`;
}

// ── GAME ──
function renderGame() {
  const tab = state.activeTab;
  return `
    <div class="game">
      <div class="top-bar">
        <span class="top-bar-title">🐺 WOLF TRACKER</span>
        <button class="end-round-btn" id="end-round-btn">End Round</button>
      </div>
      <div class="tabs">
        <button class="tab ${tab==='play'?'active':''}" data-tab="play">Play</button>
        <button class="tab ${tab==='leaderboard'?'active':''}" data-tab="leaderboard">Leaderboard</button>
        <button class="tab ${tab==='prev'?'active':''}" data-tab="prev">Previous Holes</button>
      </div>
      <div class="tab-content">
        ${tab==='play' ? renderPlay() : ''}
        ${tab==='leaderboard' ? renderLeaderboard() : ''}
        ${tab==='prev' ? renderPrevHoles() : ''}
      </div>
    </div>
    ${state.editingHole !== null ? renderEditModal() : ''}`;
}

function renderPlay() {
  const hi = state.holeInput;
  const winners = state.players.filter(p => hi.statuses[p] === 'winner');
  const losers = state.players.filter(p => hi.statuses[p] === 'loser');
  const pot = losers.length * hi.bet;
  const winEach = winners.length > 0 ? (pot / winners.length) : 0;

  let preview = '';
  if (losers.length > 0 || winners.length > 0) {
    preview = `<div class="hole-preview">`;
    if (losers.length > 0 && winners.length > 0) {
      preview += `<div class="math-line">${losers.length} loser${losers.length>1?'s':''} × $${hi.bet} = $${pot} pot</div>`;
      preview += `<div class="math-line green">Winners each get +$${winEach % 1 === 0 ? winEach : winEach.toFixed(2)}</div>`;
      preview += `<div class="math-line red">Losers each pay −$${hi.bet}</div>`;
    } else if (losers.length > 0 && winners.length === 0) {
      preview += `<div class="math-line">Waiting for at least 1 winner…</div>`;
    } else if (winners.length > 0 && losers.length === 0) {
      preview += `<div class="math-line">Waiting for at least 1 loser…</div>`;
    }
    preview += `</div>`;
  }

  let playerCards = '';
  state.players.forEach(p => {
    const status = hi.statuses[p] || 'none';
    const label = status === 'winner' ? 'WIN' : status === 'loser' ? 'LOSS' : 'PUSH';
    playerCards += `<div class="player-card ${status==='none'?'push':status}" data-player="${p}">
      <span class="player-card-name">${p}</span>
      <span class="player-card-status">${label}</span>
    </div>`;
  });

  const unset = state.players.filter(p => !hi.statuses[p] || hi.statuses[p] === 'none');
  const allDecided = unset.length === 0;
  const canConfirm = (winners.length > 0 && losers.length > 0) || (allDecided && winners.length === 0 && losers.length === 0);

  return `
    <div class="hole-header">
      <div class="hole-title">Hole ${state.currentHole} <span>of 18</span></div>
      <div class="bet-adjuster">
        <div>
          <div class="bet-adjuster-label">Bet</div>
          <div style="display:flex;align-items:center;gap:2px"><span style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--gold-bright)">$</span><input class="bet-display-input" id="bet-input" type="number" min="1" value="${hi.bet}" /></div>
        </div>
        <button class="adj-btn" id="bet-down">−</button>
        <button class="adj-btn" id="bet-up">+</button>
      </div>
    </div>
    <div class="players-grid">${playerCards}</div>
    ${preview}
    <button class="confirm-btn" id="confirm-hole-btn" ${canConfirm?'':'disabled'}>Confirm Hole ${state.currentHole}</button>`;
}

function renderLeaderboard() {
  if (state.holes.length === 0) {
    return `<div class="lb-empty">No holes completed yet.<br/>Complete a hole to see standings.</div>`;
  }

  const totals = computeTotals();
  const sorted = [...state.players].sort((a,b) => totals[b] - totals[a]);

  return sorted.map((p, i) => {
    const net = totals[p];
    const cls = net > 0 ? 'pos' : net < 0 ? 'neg' : 'zero';
    const sign = net > 0 ? '+' : '';
    const wins = state.holes.filter(h => h.results[p] > 0).length;
    const losses = state.holes.filter(h => h.results[p] < 0).length;
    return `<div class="lb-row ${i===0?'leader':''}">
      <span class="lb-rank ${i===0?'gold':''}">${i===0?'★':i+1}</span>
      <span class="lb-name">${p}</span>
      <span class="lb-holes">${wins}W ${losses}L</span>
      <span class="lb-amount ${cls}">${sign}$${Math.abs(net) % 1 === 0 ? Math.abs(net) : Math.abs(net).toFixed(2)}</span>
    </div>`;
  }).join('');
}

function renderPrevHoles() {
  if (state.holes.length === 0) {
    return `<div class="prev-empty">No holes logged yet.</div>`;
  }

  return [...state.holes].reverse().map((h, ri) => {
    const i = state.holes.length - 1 - ri;
    let chips = state.players.map(p => {
      const s = h.statuses[p];
      return `<span class="log-chip ${s}">${p}</span>`;
    }).join('');

    let resultChips = state.players.map(p => {
      const net = h.results[p];
      if (net === 0) return '';
      const cls = net > 0 ? 'winner' : 'loser';
      const sign = net > 0 ? '+' : '';
      return `<span class="log-chip ${cls}">${p}: ${sign}$${Math.abs(net) % 1 === 0 ? Math.abs(net) : Math.abs(net).toFixed(2)}</span>`;
    }).filter(Boolean).join('');

    return `<div class="hole-log-item">
      <div class="hole-log-header">
        <span class="hole-log-num">Hole ${h.num}</span>
        <span class="hole-log-bet">$${h.bet}/player</span>
        <button class="edit-hole-btn" data-edit="${i}">Edit</button>
      </div>
      <div class="hole-log-players">${chips}</div>
      <div class="hole-log-result">${resultChips}</div>
    </div>`;
  }).join('');
}

function renderEditModal() {
  const h = state.holes[state.editingHole];
  const hi = state.holeInput;

  let playerCards = '';
  state.players.forEach(p => {
    const status = hi.statuses[p] || 'push';
    const label = status === 'winner' ? 'WIN' : status === 'loser' ? 'LOSS' : 'PUSH';
    playerCards += `<div class="player-card ${status==='none'?'push':status}" data-player="${p}" style="margin-bottom:8px">
      <span class="player-card-name">${p}</span>
      <span class="player-card-status">${label}</span>
    </div>`;
  });

  return `<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-title">Edit Hole ${h.num}</div>
      <div class="bet-adjuster" style="margin-bottom:16px;display:inline-flex">
        <div>
          <div class="bet-adjuster-label">Bet</div>
          <div style="display:flex;align-items:center;gap:2px"><span style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--gold-bright)">$</span><input class="bet-display-input" id="bet-input" type="number" min="1" value="${hi.bet}" /></div>
        </div>
        <button class="adj-btn" id="bet-down">−</button>
        <button class="adj-btn" id="bet-up">+</button>
      </div>
      <div>${playerCards}</div>
      <div class="modal-actions">
        <button class="modal-cancel" id="modal-cancel">Cancel</button>
        <button class="modal-save" id="modal-save">Save</button>
      </div>
    </div>
  </div>`;
}

// ── END ──
function renderEnd() {
  const totals = computeTotals();
  const sorted = [...state.players].sort((a,b) => totals[b] - totals[a]);
  const totalPot = state.holes.reduce((s,h) => s + h.bet * Object.values(h.statuses).filter(v=>v==='loser').length, 0);
  const holesPlayed = state.holes.length;

  let rows = sorted.map((p, i) => {
    const net = totals[p];
    const cls = net > 0 ? 'pos' : net < 0 ? 'neg' : 'zero';
    const sign = net > 0 ? '+' : '';
    const wins = state.holes.filter(h => h.results[p] > 0).length;
    const losses = state.holes.filter(h => h.results[p] < 0).length;
    return `<div class="end-row ${i===0?'top-row':''}">
      <span class="end-pos">${i===0?'★':i+1}</span>
      <span class="end-name">${p}</span>
      <span class="end-holes">${wins}W / ${losses}L</span>
      <span class="end-net ${cls}">${sign}$${Math.abs(net) % 1 === 0 ? Math.abs(net) : Math.abs(net).toFixed(2)}</span>
    </div>`;
  }).join('');

  return `<div class="end-screen">
    <div class="end-logo">
      <h2>Round Complete</h2>
      <p>Final Standings</p>
    </div>
    <div class="stat-row">
      <div class="stat-item"><div class="stat-val">${holesPlayed}</div><div class="stat-lbl">Holes</div></div>
      <div class="stat-item"><div class="stat-val">$${totalPot}</div><div class="stat-lbl">Total Action</div></div>
      <div class="stat-item"><div class="stat-val">$${state.defaultBet}</div><div class="stat-lbl">Base Bet</div></div>
    </div>
    <div class="end-card">${rows}</div>
    <button class="new-round-btn" id="new-round-btn">New Round</button>
    <button class="continue-btn" id="continue-btn">← Back to Round</button>
  </div>`;
}

// ── MATH ──
function computeHoleResult(bet, statuses) {
  const winners = Object.entries(statuses).filter(([,v])=>v==='winner').map(([k])=>k);
  const losers = Object.entries(statuses).filter(([,v])=>v==='loser').map(([k])=>k);
  const results = {};
  Object.keys(statuses).forEach(p => results[p] = 0);
  if (winners.length > 0 && losers.length > 0) {
    const pot = losers.length * bet;
    const winEach = pot / winners.length;
    winners.forEach(p => results[p] = winEach);
    losers.forEach(p => results[p] = -bet);
  }
  return results;
}

function computeTotals() {
  const totals = {};
  state.players.forEach(p => totals[p] = 0);
  state.holes.forEach(h => {
    state.players.forEach(p => { totals[p] += (h.results[p] || 0); });
  });
  return totals;
}

// ── EVENTS ──
function attachEvents() {
  if (state.screen === 'setup') attachSetupEvents();
  else if (state.screen === 'game') attachGameEvents();
  else if (state.screen === 'end') attachEndEvents();
}

function attachSetupEvents() {
  document.querySelectorAll('.player-name-input').forEach(input => {
    input.addEventListener('input', e => {
      state.players[parseInt(e.target.dataset.idx)] = e.target.value;
    });
  });

  document.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.remove);
      state.players.splice(idx, 1);
      render();
    });
  });

  const addBtn = document.getElementById('add-player-btn');
  if (addBtn) addBtn.addEventListener('click', () => {
    if (state.players.length < 5) { state.players.push(''); render(); }
  });

  const betInput = document.getElementById('default-bet');
  if (betInput) betInput.addEventListener('input', e => {
    state.defaultBet = parseFloat(e.target.value) || 5;
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    // clean up names
    state.players = state.players.map((p,i) => p.trim() || `Player ${i+1}`);
    if (state.players.length < 2) { alert('Need at least 2 players.'); return; }
    state.screen = 'game';
    state.holes = [];
    state.currentHole = 1;
    state.activeTab = 'play';
    state.editingHole = null;
    state.holeInput = { bet: state.defaultBet, statuses: {} };
    state.players.forEach(p => state.holeInput.statuses[p] = 'none');
    render();
  });
}

function attachGameEvents() {
  // tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', e => {
      state.activeTab = e.target.dataset.tab;
      render();
    });
  });

  document.getElementById('end-round-btn')?.addEventListener('click', () => {
    if (state.holes.length === 0) { alert('Complete at least one hole first.'); return; }
    state.screen = 'end';
    render();
  });

  if (state.activeTab === 'play') {
    // bet adjusters
    document.getElementById('bet-up')?.addEventListener('click', () => {
      state.holeInput.bet = Math.max(1, state.holeInput.bet + 1);
      render();
    });
    document.getElementById('bet-down')?.addEventListener('click', () => {
      state.holeInput.bet = Math.max(1, state.holeInput.bet - 1);
      render();
    });
    document.getElementById('bet-input')?.addEventListener('input', e => {
      const val = parseInt(e.target.value);
      if (!isNaN(val) && val >= 1) state.holeInput.bet = val;
    });
    document.getElementById('bet-input')?.addEventListener('blur', () => {
      render();
    });

    // player cards cycle: none→winner→loser→push→winner…
    document.querySelectorAll('.player-card[data-player]').forEach(card => {
      card.addEventListener('click', e => {
        const p = card.dataset.player;
        const cur = state.holeInput.statuses[p] || 'none';
        const cycle = { none: 'winner', winner: 'loser', loser: 'push', push: 'winner' };
        state.holeInput.statuses[p] = cycle[cur];
        render();
      });
    });

    document.getElementById('confirm-hole-btn')?.addEventListener('click', () => {
      const hi = state.holeInput;
      const results = computeHoleResult(hi.bet, hi.statuses);
      state.holes.push({
        num: state.currentHole,
        bet: hi.bet,
        statuses: { ...hi.statuses },
        results
      });
      state.currentHole++;
      state.holeInput = { bet: state.defaultBet, statuses: {} };
      state.players.forEach(p => state.holeInput.statuses[p] = 'none');
      render();
    });
  }

  if (state.activeTab === 'prev') {
    document.querySelectorAll('.edit-hole-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const idx = parseInt(e.target.dataset.edit);
        state.editingHole = idx;
        const h = state.holes[idx];
        state.holeInput = { bet: h.bet, statuses: { ...h.statuses } };
        render();
      });
    });
  }

  // modal
  if (state.editingHole !== null) {
    document.getElementById('modal-cancel')?.addEventListener('click', () => {
      state.editingHole = null;
      state.holeInput = { bet: state.defaultBet, statuses: {} };
      state.players.forEach(p => state.holeInput.statuses[p] = 'none');
      render();
    });

    document.getElementById('modal-overlay')?.addEventListener('click', e => {
      if (e.target.id === 'modal-overlay') {
        state.editingHole = null;
        state.holeInput = { bet: state.defaultBet, statuses: {} };
        state.players.forEach(p => state.holeInput.statuses[p] = 'none');
        render();
      }
    });

    document.getElementById('modal-save')?.addEventListener('click', () => {
      const hi = state.holeInput;
      const results = computeHoleResult(hi.bet, hi.statuses);
      state.holes[state.editingHole].bet = hi.bet;
      state.holes[state.editingHole].statuses = { ...hi.statuses };
      state.holes[state.editingHole].results = results;
      state.editingHole = null;
      state.holeInput = { bet: state.defaultBet, statuses: {} };
      state.players.forEach(p => state.holeInput.statuses[p] = 'none');
      render();
    });

    document.getElementById('bet-up')?.addEventListener('click', () => {
      state.holeInput.bet = Math.max(1, state.holeInput.bet + 1);
      render();
    });
    document.getElementById('bet-down')?.addEventListener('click', () => {
      state.holeInput.bet = Math.max(1, state.holeInput.bet - 1);
      render();
    });
    document.getElementById('bet-input')?.addEventListener('input', e => {
      const val = parseInt(e.target.value);
      if (!isNaN(val) && val >= 1) state.holeInput.bet = val;
    });
    document.getElementById('bet-input')?.addEventListener('blur', () => {
      render();
    });

    document.querySelectorAll('.player-card[data-player]').forEach(card => {
      card.addEventListener('click', () => {
        const p = card.dataset.player;
        const cur = state.holeInput.statuses[p] || 'none';
        const cycle = { none: 'winner', winner: 'loser', loser: 'push', push: 'winner' };
        state.holeInput.statuses[p] = cycle[cur];
        render();
      });
    });
  }
}

function attachEndEvents() {
  document.getElementById('new-round-btn')?.addEventListener('click', () => {
    state.screen = 'setup';
    state.holes = [];
    state.currentHole = 1;
    state.holeInput = { bet: state.defaultBet, statuses: {} };
    render();
  });
  document.getElementById('continue-btn')?.addEventListener('click', () => {
    state.screen = 'game';
    state.activeTab = 'play';
    render();
  });
}

// ── BOOT ──
render();
</script>
</body>
</html>
