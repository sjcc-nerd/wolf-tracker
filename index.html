function renderSSScorecard() {
  const sg = state.ssGame;
  const ss = state.ssSetup;
  const hi = sg.currentHole;
  const hole = SJCC.holes[hi];
  const skinsState = computeSSSkinsState();
  const holeResult = skinsState[hi];

  const scoreRows = ss.players.map(p => {
    const gross = (sg.scores[p.name] || {})[hi];
    const strokes = strokesOnHole(p.hcp, hole.hcp, ss.hcpPct);
    const hasScore = gross != null;
    const net = hasScore ? gross - strokes : null;
    const slabel = hasScore ? scoreLabel(gross, hole.par) : '';
    return '<div class="score-row">'
      + '<div style="flex:1">'
      + '<div class="score-player-name">'+p.name+'</div>'
      + '<div style="display:flex;gap:6px;margin-top:2px">'
      + '<span class="score-player-hcp">Hcp '+p.hcp+'</span>'
      + (strokes > 0 ? '<span class="score-stroke-badge">+'+strokes+' stroke'+(strokes>1?'s':'')+'</span>' : '')
      + '</div></div>'
      + '<div class="score-adj">'
      + '<button class="sc-btn" data-ss-down="'+p.name+'">−</button>'
      + '<div class="sc-val '+slabel+'">'+(hasScore ? gross : '–')+'</div>'
      + '<button class="sc-btn" data-ss-up="'+p.name+'">+</button>'
      + '</div>'
      + '<div class="sc-net">'+(net != null ? 'net '+net : '')+'</div>'
      + '</div>';
  }).join('');

  let resultSnip = '';
  if (!holeResult.pending) {
    if (holeResult.winner) {
      resultSnip = '<div class="hole-result-box" style="margin-bottom:10px">'
        + '<div class="hole-result-row"><span class="label">Skin winner</span>'
        + '<span class="chip green">'+holeResult.winner+(holeResult.carried?' ('+holeResult.pot+'× carry)':'')+'</span>'
        + '</div></div>';
    } else if (holeResult.push) {
      resultSnip = '<div class="hole-result-box" style="margin-bottom:10px">'
        + '<div class="hole-result-row"><span class="label">Hole result</span>'
        + '<span class="chip gray">Push'+(ss.betMode==='perhole'&&ss.carryover?' → carries':'')+'</span>'
        + '</div></div>';
    }
  }

  return '<div>'
    + '<div class="hole-nav">'
    + '<div><div class="hole-nav-title">Hole '+hole.num+'</div><div class="hole-nav-sub">'+SJCC.name+'</div></div>'
    + '<div style="display:flex;gap:8px">'
    + '<button class="back-btn" id="ss-prev" '+(hi>0?'':'disabled')+'>← Prev</button>'
    + '<button class="back-btn" id="ss-next" '+(hi<17?'':'disabled')+'>Next →</button>'
    + '</div></div>'
    + '<div class="hole-meta">'
    + '<div class="hole-meta-item">Par <span>'+hole.par+'</span></div>'
    + '<div class="hole-meta-item">Yds <span>'+hole.yds+'</span></div>'
    + '<div class="hole-meta-item">Hcp <span>'+hole.hcp+'</span></div>'
    + '</div>'
    + '<div class="score-entry">'+scoreRows+'</div>'
    + resultSnip
    + (hi < 17
      ? '<button class="big-btn gold" id="ss-confirm-hole">Confirm Hole '+hole.num+' →</button>'
      : '<button class="big-btn green" id="ss-finish-round">Finish Round ✓</button>')
    + '</div>';
}

function renderSSLeaderboard() {
  const sg = state.ssGame;
  const ss = state.ssSetup;
  const skinsState = computeSSSkinsState();
  const totals = computeSSTotals(skinsState);
  const holesConfirmed = sg.confirmedHoles || 0;
  const anyComplete = skinsState.some(s => !s.pending);
  if (!anyComplete) return '<div style="text-align:center;color:var(--muted);padding:40px 0">Enter scores to see standings</div>';

  const sorted = [...ss.players].sort((a,b) => totals[b.name] - totals[a.name]);
  const lbRows = sorted.map((p, i) => {
    const net = totals[p.name];
    const cls = net>0?'pos':net<0?'neg':'zero';
    const sign = net>0?'+':'';
    const won = skinsState.filter(s=>s.winner===p.name).length;
    const leaderClass = (i===0&&net>0) ? 'leader' : '';
    return '<div class="lb-row '+leaderClass+'">'
      + '<span class="lb-rank '+(i===0&&net>0?'gold':'')+'">'+(i===0&&net>0?'★':i+1)+'</span>'
      + '<span class="lb-name">'+p.name+'</span>'
      + '<span class="lb-detail">'+won+' skin'+(won!==1?'s':'')+'</span>'
      + '<span class="lb-val '+cls+'">'+sign+'$'+fmt(Math.abs(net))+'</span>'
      + '</div>';
  }).join('');

  // Hole log
  const holeLog = skinsState.filter(s => !s.pending).map(s => {
    const hole = SJCC.holes[s.hole-1];
    if (s.pending) return '<div class="hole-result-row" style="padding:5px 0"><span class="label" style="color:var(--muted)">Hole '+s.hole+' (Par '+hole.par+')</span><span class="chip gray">Pending</span></div>';
    if (s.push) return '<div class="hole-result-row" style="padding:5px 0"><span class="label" style="color:var(--muted)">Hole '+s.hole+' (Par '+hole.par+')</span><span class="chip gray">Push'+(ss.betMode==='perhole'&&ss.carryover?' → Carries':'')+'</span></div>';
    return '<div class="hole-result-row" style="padding:5px 0"><span class="label" style="color:var(--muted)">Hole '+s.hole+' (Par '+hole.par+')</span>'
      + '<span class="chip green">'+s.winner+(s.carried?' ('+s.pot+'×)':'')+'</span></div>';
  }).join('');

  const betInfo = ss.betMode === 'perhole'
    ? '$'+ss.skinBet+'/skin'+(ss.carryover?' · Carryover':'')
    : '$'+ss.buyIn+' buy-in · $'+(ss.buyIn*ss.players.length)+' pot';

  return '<div>'
    + '<div class="stat-strip">'
    + '<div class="stat-item"><div class="stat-val">'+skinsState.filter(s=>!s.pending).length+'</div><div class="stat-lbl">Holes</div></div>'
    + '<div class="stat-item"><div class="stat-val">'+skinsState.filter(s=>s.winner).length+'</div><div class="stat-lbl">Skins</div></div>'
    + '<div class="stat-item"><div class="stat-val">'+(ss.skinType==='canadian'?'🍁':ss.skinType==='gross'?'Gross':'Net')+'</div><div class="stat-lbl">Format</div></div>'
    + '</div>'
    + '<div style="font-family:IBM Plex Mono,monospace;font-size:0.72rem;color:var(--muted);text-align:center;margin-bottom:12px">'+betInfo+'</div>'
    + lbRows
    + '<div class="card" style="margin-top:12px"><div style="font-family:Bebas Neue,sans-serif;font-size:0.9rem;color:var(--gold);letter-spacing:0.08em;margin-bottom:8px">Hole by Hole</div>'
    + holeLog + '</div></div>';
}

function renderSSSummary() {
  const sg = state.ssGame;
  const ss = state.ssSetup;
  const skinsState = computeSSSkinsState();
  const totals = computeSSTotals(skinsState);
  const sorted = [...ss.players].sort((a,b) => totals[b.name] - totals[a.name]);
  const holesConfirmed = sg.confirmedHoles || 0;
  const totalSkinsWon = skinsState.filter(s=>s.winner).length;

  // Payout: just show what each player collects or nets
  // For total pot: winners collect skins * valuePerSkin, losers collect nothing
  // For per hole: net is already correct from computeSSTotals

  const ptRows = sorted.map((p, i) => {
    const net = totals[p.name];
    const cls = net>0?'pos':net<0?'neg':'zero';
    const sign = net>0?'+':'';
    const won = skinsState.filter(s=>s.winner===p.name).length;
    return '<div class="lb-row">'
      + '<span class="lb-rank '+(i===0?'gold':'')+'">'+(i===0?'★':i+1)+'</span>'
      + '<div style="flex:1;margin-left:8px"><div class="lb-name">'+p.name+'</div>'
      + '<div style="font-family:IBM Plex Mono,monospace;font-size:0.7rem;color:var(--muted)">'+won+' skin'+(won!==1?'s':'')+'</div></div>'
      + '<span class="lb-val '+cls+'" style="font-size:1.5rem">'+sign+'$'+fmt(Math.abs(net))+'</span>'
      + '</div>';
  }).join('');

  const ledgerRows = sorted.map(p => {
    const net = totals[p.name];
    const won = skinsState.filter(s => s.winner === p.name).length;
    if (won === 0) return '';
    const cls = 'var(--green-text)';
    return '<div class="hole-result-row" style="padding:7px 0">'
      + '<span style="font-family:IBM Plex Mono,monospace;font-size:0.85rem;color:var(--white);font-weight:600">'+p.name+'</span>'
      + '<span style="font-family:IBM Plex Mono,monospace;font-size:0.72rem;color:var(--muted)">'+won+' skin'+(won!==1?'s':'')+' →</span>'
      + '<span style="font-family:Bebas Neue,sans-serif;font-size:1.2rem;color:'+cls+'">+$'+fmt(Math.abs(net > 0 ? net : won * (ss.betMode==='totalpot' ? (ss.buyIn*ss.players.length/totalSkinsWon) : ss.skinBet*(ss.players.length-1))))+'</span>'
      + '</div>';
  }).filter(Boolean).join('') || '<div style="text-align:center;color:var(--muted);font-size:0.82rem;padding:10px">No skins won yet</div>';

  const betSummary = ss.betMode === 'perhole'
    ? '$'+ss.skinBet+' per skin · '+totalSkinsWon+' skins won'
    : '$'+ss.buyIn+' buy-in · $'+(ss.buyIn*ss.players.length)+' pot · $'+fmt(totalSkinsWon>0?(ss.buyIn*ss.players.length/totalSkinsWon):0)+'/skin';

  // Scorecard table
  const completedHoles = skinsState.filter(s => !s.pending);
  const holeHeaders = completedHoles.map(s =>
    '<th style="font-family:IBM Plex Mono,monospace;font-size:0.62rem;color:var(--muted);padding:3px 5px;text-align:center;font-weight:400">'+s.hole+'</th>'
  ).join('');

  const scorecardRows = ss.players.map(p => {
    let cells = completedHoles.map(s => {
      const hi = s.hole - 1;
      const hole = SJCC.holes[hi];
      const gross = (sg.scores[p.name] || {})[hi];
      if (gross == null) return '<td style="color:var(--muted);font-family:IBM Plex Mono,monospace;font-size:0.7rem;padding:3px 5px;text-align:center">–</td>';
      const strokes = strokesOnHole(p.hcp, hole.hcp, ss.hcpPct);
      const net = gross - strokes;
      const diff = gross - hole.par;
      const color = diff <= -2 ? '#f0e68c' : diff === -1 ? 'var(--gold-bright)' : diff === 0 ? 'var(--white)' : diff === 1 ? '#ff9944' : 'var(--red-text)';
      const isSkinWinner = s.winner === p.name;
      return '<td style="color:'+color+';font-family:IBM Plex Mono,monospace;font-size:0.7rem;padding:3px 5px;text-align:center;'+(isSkinWinner?'background:rgba(86,211,100,0.15);border-radius:3px':'')+'">'
        + gross + (strokes > 0 ? '*' : '') + (isSkinWinner ? '🏆' : '')
        + '</td>';
    }).join('');
    return '<tr><td style="font-weight:600;font-size:0.82rem;padding:5px 8px;white-space:nowrap">'+p.name+'</td>'+cells+'</tr>';
  }).join('');

  const parRow = '<tr><td style="font-family:IBM Plex Mono,monospace;font-size:0.65rem;color:var(--muted);padding:2px 8px">Par</td>'
    + completedHoles.map(s => '<td style="font-family:IBM Plex Mono,monospace;font-size:0.65rem;color:var(--muted);padding:2px 5px;text-align:center">'+SJCC.holes[s.hole-1].par+'</td>').join('')
    + '</tr>';

  const scorecard = completedHoles.length > 0
    ? '<div class="card" style="overflow-x:auto;padding:10px;margin-top:12px">'      + '<div style="font-family:Bebas Neue,sans-serif;font-size:0.9rem;letter-spacing:0.08em;color:var(--gold);margin-bottom:6px">Scorecard <span style="font-size:0.7rem;font-family:IBM Plex Mono,monospace;color:var(--muted);font-weight:400">* = stroke · 🏆 = skin</span></div>'      + '<table style="border-collapse:collapse;width:100%"><thead><tr>'      + '<th style="font-family:IBM Plex Mono,monospace;font-size:0.62rem;color:var(--muted);padding:3px 8px;text-align:left;font-weight:400">Player</th>'      + holeHeaders + '</tr>' + parRow + '</thead><tbody>'+scorecardRows+'</tbody></table></div>'
    : '';

  return '<div>'
    + '<div class="stat-strip">'
    + '<div class="stat-item"><div class="stat-val">'+completedHoles.length+'</div><div class="stat-lbl">Holes</div></div>'
    + '<div class="stat-item"><div class="stat-val">'+totalSkinsWon+'</div><div class="stat-lbl">Skins</div></div>'
    + '<div class="stat-item"><div class="stat-val">'+ss.players.length+'</div><div class="stat-lbl">Players</div></div>'
    + '</div>'
    + '<div style="font-family:IBM Plex Mono,monospace;font-size:0.72rem;color:var(--muted);text-align:center;margin-bottom:12px">'+betSummary+'</div>'
    + '<div class="lb-card"><div class="lb-card-header">Final Standings</div>'+ptRows+'</div>'
    + '<div class="lb-card"><div class="lb-card-header">💰 Payouts</div><div style="padding:10px 14px">'+ledgerRows+'</div></div>'
    + scorecard
    + '<button class="big-btn green" id="ss-new-round">New Round</button>'
    + '<button class="big-btn ghost" id="ss-back-to-game">← Back to Round</button>'
    + '</div>';
}

// ── SS SETUP EVENTS ──
function attachSSSetupEvents() {
  const ss = state.ssSetup;
  document.querySelectorAll('.ss-pname').forEach(inp => {
    inp.addEventListener('input', e => { ss.players[parseInt(e.target.dataset.idx)].name = e.target.value; });
    inp.addEventListener('blur', () => render());
  });
  document.querySelectorAll('.ss-hcp').forEach(inp => {
    inp.addEventListener('input', e => { ss.players[parseInt(e.target.dataset.idx)].hcp = parseFloat(e.target.value)||0; });
  });
  document.querySelector('[data-ss-remove]')?.addEventListener('click', e => {
    ss.players.splice(parseInt(e.target.dataset.ssRemove),1); render();
  });
  document.getElementById('ss-add-player')?.addEventListener('click', () => { ss.players.push({name:'',hcp:0}); render(); });
  document.getElementById('ss-hcp-pct')?.addEventListener('input', e => { ss.hcpPct=parseFloat(e.target.value)||100; });
  document.getElementById('ss-skin-bet')?.addEventListener('input', e => { ss.skinBet=parseFloat(e.target.value)||1; });
  document.getElementById('ss-buy-in')?.addEventListener('input', e => { ss.buyIn=parseFloat(e.target.value)||1; render(); });
  document.getElementById('ss-carryover')?.addEventListener('change', e => { ss.carryover=e.target.checked; });
  document.querySelectorAll('[data-ss-skin]').forEach(btn => {
    btn.addEventListener('click', e => { ss.skinType=e.target.dataset.ssSkin; render(); });
  });
  document.querySelectorAll('[data-ss-mode]').forEach(btn => {
    btn.addEventListener('click', e => { ss.betMode=e.target.dataset.ssMode; render(); });
  });
  document.getElementById('ss-start')?.addEventListener('click', () => {
    ss.players = ss.players.map((p,i)=>({...p, name:p.name.trim()||'Player '+(i+1)}));
    const scores = {};
    ss.players.forEach(p => { scores[p.name] = {}; });
    state.ssGame = { tab:'scorecard', currentHole:0, scores, confirmedHoles:0 };
    state.ssSaved = true;
    state.screen = 'ss-game';
    render();
  });
}

// ── SS GAME EVENTS ──
function attachSSGameEvents() {
  const sg = state.ssGame;
  const ss = state.ssSetup;

  document.querySelectorAll('[data-ss-tab]').forEach(t => {
    t.addEventListener('click', e => { sg.tab=e.target.dataset.ssTab; render(); });
  });
  document.getElementById('ss-end-round')?.addEventListener('click', () => { state.ssSaved=false; state.screen='home'; render(); });
  document.getElementById('ss-prev')?.addEventListener('click', () => { if(sg.currentHole>0){sg.currentHole--; render();} });
  document.getElementById('ss-next')?.addEventListener('click', () => { if(sg.currentHole<17){sg.currentHole++; render();} });

  document.querySelectorAll('[data-ss-up]').forEach(btn => {
    btn.addEventListener('click', e => {
      const p = e.target.dataset.ssUp;
      const hi = sg.currentHole;
      if (!sg.scores[p]) sg.scores[p] = {};
      const par = SJCC.holes[hi].par;
      sg.scores[p][hi] = (sg.scores[p][hi] != null ? sg.scores[p][hi] : par - 1) + 1;
      render();
    });
  });
  document.querySelectorAll('[data-ss-down]').forEach(btn => {
    btn.addEventListener('click', e => {
      const p = e.target.dataset.ssDown;
      const hi = sg.currentHole;
      if (!sg.scores[p]) sg.scores[p] = {};
      const par = SJCC.holes[hi].par;
      const cur = sg.scores[p][hi] != null ? sg.scores[p][hi] : par + 1;
      sg.scores[p][hi] = Math.max(1, cur - 1);
      render();
    });
  });

  document.getElementById('ss-confirm-hole')?.addEventListener('click', () => {
    sg.confirmedHoles = (sg.confirmedHoles || 0) + 1;
    sg.currentHole++;
    render();
  });

  document.getElementById('ss-finish-round')?.addEventListener('click', () => {
    sg.confirmedHoles = 18;
    sg.tab = 'summary';
    render();
  });

  document.getElementById('ss-new-round')?.addEventListener('click', () => { state.screen='ss-setup'; state.ssSaved=false; render(); });
  document.getElementById('ss-back-to-game')?.addEventListener('click', () => { sg.tab='scorecard'; render(); });
}

    + '<div class="tab-content">'
    + (tab==='scorecard'   ? renderJKSScorecard()   : '')
    + (tab==='leaderboard' ? renderJKSLeaderboard() : '')
    + (tab==='summary'     ? renderJKSSummary()     : '')
    + '</div>';
}

function renderJKSScorecard() {
  const jg = state.jksGame;
  const jks = state.jksSetup;
  const hi = jg.currentHole;
  const hole = SJCC.holes[hi];

  const scoreRows = jks.players.map(p => {
    const gross = (jg.scores[p.name] || {})[hi];
    const strokes = strokesOnHole(p.hcp, hole.hcp, jks.hcpPct);
    const hasScore = gross != null;
    const net = hasScore ? gross - strokes : null;
    const slabel = hasScore ? scoreLabel(gross, hole.par) : '';
    const diff = hasScore ? gross - hole.par : null;
    const diffStr = diff === null ? '' : (diff > 0 ? '+'+diff : diff === 0 ? 'E' : ''+diff);
    const diffColor = diff === null ? '' : diff < 0 ? 'var(--gold-bright)' : diff === 0 ? 'var(--white)' : diff > 0 ? '#ff9944' : 'var(--red-text)';

    return '<div class="score-row">'
      + '<div style="flex:1">'
      + '<div class="score-player-name">'+p.name+'</div>'
      + '<div style="display:flex;gap:6px;align-items:center;margin-top:2px">'
      + '<span class="score-player-hcp">Hcp '+p.hcp+'</span>'
      + (strokes > 0 ? '<span class="score-stroke-badge">+'+strokes+' stroke'+(strokes>1?'s':'')+'</span>' : '')
      + (diff !== null ? '<span style="font-family:IBM Plex Mono,monospace;font-size:0.7rem;color:'+diffColor+'">'+diffStr+'</span>' : '')
      + '</div></div>'
      + '<div class="score-adj">'
      + '<button class="sc-btn" data-jks-down="'+p.name+'">−</button>'
      + '<div class="sc-val '+slabel+'">'+(hasScore ? gross : '–')+'</div>'
      + '<button class="sc-btn" data-jks-up="'+p.name+'">+</button>'
      + '</div>'
      + '<div class="sc-net">'+(net != null ? 'net '+net : '')+'</div>'
      + '</div>';
  }).join('');

  return '<div>'
    + '<div class="hole-nav">'
    + '<div><div class="hole-nav-title">Hole '+hole.num+'</div><div class="hole-nav-sub">'+SJCC.name+'</div></div>'
    + '<div style="display:flex;gap:8px">'
    + '<button class="back-btn" id="jks-prev" '+(hi>0?'':'disabled')+'>← Prev</button>'
    + '<button class="back-btn" id="jks-next" '+(hi<17?'':'disabled')+'>Next →</button>'
    + '</div></div>'
    + '<div class="hole-meta">'
    + '<div class="hole-meta-item">Par <span>'+hole.par+'</span></div>'
    + '<div class="hole-meta-item">Yds <span>'+hole.yds+'</span></div>'
    + '<div class="hole-meta-item">Hcp <span>'+hole.hcp+'</span></div>'
    + '</div>'
    + '<div class="score-entry">'+scoreRows+'</div>'
    + (hi < 17
      ? '<button class="big-btn gold" id="jks-confirm-hole">Confirm Hole '+hole.num+' →</button>'
      : '<button class="big-btn green" id="jks-finish-round">Finish Round ✓</button>')
    + '</div>';
}

function renderJKSLeaderboard() {
  const jg = state.jksGame;
  const jks = state.jksSetup;
  const scores = jg.scores || {};
  const holesPlayed = jg.confirmedHoles || 0;

  if (holesPlayed === 0) return '<div style="text-align:center;color:var(--muted);padding:40px 0">Complete a hole to see standings</div>';

  // Compute totals
  const totals = jks.players.map(p => {
    let gross = 0, net = 0, parTotal = 0;
    for (let hi = 0; hi < holesPlayed; hi++) {
      const hole = SJCC.holes[hi];
      const g = (scores[p.name] || {})[hi];
      if (g != null) {
        const strokes = strokesOnHole(p.hcp, hole.hcp, jks.hcpPct);
        gross += g;
        net += g - strokes;
        parTotal += hole.par;
      }
    }
    return { name: p.name, gross, net, parTotal, grossDiff: gross - parTotal, netDiff: net - parTotal };
  });

  // Sort by net score (lowest first = best)
  const sorted = [...totals].sort((a,b) => a.net - b.net);
  const parPlayed = SJCC.holes.slice(0, holesPlayed).reduce((s,h) => s+h.par, 0);

  const rows = sorted.map((p, i) => {
    const netDiff = p.net - parPlayed;
    const grossDiff = p.gross - parPlayed;
    const netStr = netDiff === 0 ? 'E' : (netDiff > 0 ? '+'+netDiff : ''+netDiff);
    const grossStr = grossDiff === 0 ? 'E' : (grossDiff > 0 ? '+'+grossDiff : ''+grossDiff);
    const netColor = netDiff < 0 ? 'var(--gold-bright)' : netDiff === 0 ? 'var(--white)' : 'var(--red-text)';
    return '<div class="lb-row '+(i===0?'leader':'')+'">'
      + '<span class="lb-rank '+(i===0?'gold':'')+'">'+(i===0?'★':i+1)+'</span>'
      + '<span class="lb-name">'+p.name+'</span>'
      + '<div style="text-align:right">'
      + '<div style="font-family:Bebas Neue,sans-serif;font-size:1.3rem;color:'+netColor+'">'+netStr+'</div>'
      + '<div style="font-family:IBM Plex Mono,monospace;font-size:0.65rem;color:var(--muted)">net '+p.net+' · gross '+grossStr+'</div>'
      + '</div></div>';
  }).join('');

  return '<div>'
    + '<div class="stat-strip">'
    + '<div class="stat-item"><div class="stat-val">'+holesPlayed+'</div><div class="stat-lbl">Holes</div></div>'
    + '<div class="stat-item"><div class="stat-val">'+parPlayed+'</div><div class="stat-lbl">Par</div></div>'
    + '<div class="stat-item"><div class="stat-val">'+jks.players.length+'</div><div class="stat-lbl">Players</div></div>'
    + '</div>'
    + rows + '</div>';
}

function renderJKSSummary() {
  const jg = state.jksGame;
  const jks = state.jksSetup;
  const scores = jg.scores || {};
  const holesPlayed = jg.confirmedHoles || 18;
  const parPlayed = SJCC.holes.slice(0, holesPlayed).reduce((s,h) => s+h.par, 0);

  // Totals per player
  const totals = jks.players.map(p => {
    let gross = 0, net = 0;
    for (let hi = 0; hi < holesPlayed; hi++) {
      const hole = SJCC.holes[hi];
      const g = (scores[p.name] || {})[hi];
      if (g != null) {
        gross += g;
        net += g - strokesOnHole(p.hcp, hole.hcp, jks.hcpPct);
      }
    }
    return { name: p.name, gross, net, hcp: p.hcp };
  }).sort((a,b) => a.net - b.net);

  const standingsRows = totals.map((p, i) => {
    const netDiff = p.net - parPlayed;
    const grossDiff = p.gross - parPlayed;
    const netStr = netDiff === 0 ? 'E' : (netDiff > 0 ? '+'+netDiff : ''+netDiff);
    const grossStr = grossDiff === 0 ? 'E' : (grossDiff > 0 ? '+'+grossDiff : ''+grossDiff);
    const netColor = netDiff < 0 ? 'var(--gold-bright)' : netDiff === 0 ? 'var(--white)' : 'var(--red-text)';
    return '<div class="lb-row">'
      + '<span class="lb-rank '+(i===0?'gold':'')+'">'+(i===0?'★':i+1)+'</span>'
      + '<div style="flex:1;margin-left:8px">'
      + '<div class="lb-name">'+p.name+'</div>'
      + '<div style="font-family:IBM Plex Mono,monospace;font-size:0.68rem;color:var(--muted)">Hcp '+p.hcp+' · Gross '+p.gross+' ('+grossStr+')</div>'
      + '</div>'
      + '<div style="font-family:Bebas Neue,sans-serif;font-size:1.5rem;color:'+netColor+'">'+netStr+'</div>'
      + '</div>';
  }).join('');

  // Scorecard table — gross with net in parens on stroke holes
  const holeHeaders = SJCC.holes.slice(0, holesPlayed).map(h =>
    '<th style="font-family:IBM Plex Mono,monospace;font-size:0.6rem;color:var(--muted);padding:3px 4px;text-align:center;font-weight:400">'+h.num+'</th>'
  ).join('');

  const parRow = '<tr><td style="font-family:IBM Plex Mono,monospace;font-size:0.6rem;color:var(--muted);padding:2px 6px">Par</td>'
    + SJCC.holes.slice(0,holesPlayed).map(h=>'<td style="font-family:IBM Plex Mono,monospace;font-size:0.6rem;color:var(--muted);padding:2px 4px;text-align:center">'+h.par+'</td>').join('')
    + '<td style="font-family:IBM Plex Mono,monospace;font-size:0.6rem;color:var(--muted);padding:2px 6px;text-align:center;border-left:1px solid var(--border)">'+parPlayed+'</td>'
    + '<td style="font-family:IBM Plex Mono,monospace;font-size:0.6rem;color:var(--muted);padding:2px 6px;text-align:center">–</td>'
    + '</tr>';

  const scorecardRows = jks.players.map(p => {
    let grossTotal = 0, netTotal = 0;
    const cells = SJCC.holes.slice(0, holesPlayed).map((hole, hi) => {
      const g = (scores[p.name] || {})[hi];
      if (g == null) return '<td style="color:var(--muted);font-size:0.65rem;padding:3px 4px;text-align:center">–</td>';
      const strokes = strokesOnHole(p.hcp, hole.hcp, jks.hcpPct);
      const net = g - strokes;
      grossTotal += g;
      netTotal += net;
      const diff = g - hole.par;
      const color = diff <= -2 ? '#f0e68c' : diff === -1 ? 'var(--gold-bright)' : diff === 0 ? 'var(--white)' : diff === 1 ? '#ff9944' : 'var(--red-text)';
      return '<td style="color:'+color+';font-family:IBM Plex Mono,monospace;font-size:0.65rem;padding:3px 4px;text-align:center">'
        + g + (strokes > 0 ? '*' : '') + '</td>';
    }).join('');

    const totalDiff = grossTotal - parPlayed;
    const netDiff = netTotal - parPlayed;
    const totalStr = totalDiff === 0 ? 'E' : (totalDiff > 0 ? '+'+totalDiff : ''+totalDiff);
    const netStr = netDiff === 0 ? 'E' : (netDiff > 0 ? '+'+netDiff : ''+netDiff);
    const netColor = netDiff < 0 ? 'var(--gold-bright)' : netDiff === 0 ? 'var(--white)' : '#ff9944';

    return '<tr>'
      + '<td style="font-weight:600;font-size:0.75rem;padding:5px 6px;white-space:nowrap">'+p.name+'</td>'
      + cells
      + '<td style="font-family:IBM Plex Mono,monospace;font-size:0.7rem;padding:3px 6px;text-align:center;border-left:1px solid var(--border);color:var(--white)">'+grossTotal+'<br><span style="color:var(--muted);font-size:0.6rem">'+totalStr+'</span></td>'
      + '<td style="font-family:Bebas Neue,sans-serif;font-size:0.9rem;padding:3px 6px;text-align:center;color:'+netColor+'">'+netStr+'</td>'
      + '</tr>';
  }).join('');

  return '<div>'
    + '<div class="stat-strip">'
    + '<div class="stat-item"><div class="stat-val">'+holesPlayed+'</div><div class="stat-lbl">Holes</div></div>'
    + '<div class="stat-item"><div class="stat-val">'+parPlayed+'</div><div class="stat-lbl">Par</div></div>'
    + '<div class="stat-item"><div class="stat-val">'+jks.players.length+'</div><div class="stat-lbl">Players</div></div>'
    + '</div>'
    + '<div class="lb-card" style="margin-bottom:12px"><div class="lb-card-header">Final Standings — Net Score</div>'+standingsRows+'</div>'
    + '<div class="card" style="overflow-x:auto;padding:10px">'
    + '<div style="font-family:Bebas Neue,sans-serif;font-size:0.9rem;letter-spacing:0.08em;color:var(--gold);margin-bottom:6px">Full Scorecard <span style="font-size:0.68rem;font-family:IBM Plex Mono,monospace;color:var(--muted);font-weight:400">* = stroke received</span></div>'
    + '<table style="border-collapse:collapse;width:100%">'
    + '<thead><tr>'
    + '<th style="font-family:IBM Plex Mono,monospace;font-size:0.6rem;color:var(--muted);padding:3px 6px;text-align:left;font-weight:400">Player</th>'
    + holeHeaders
    + '<th style="font-family:IBM Plex Mono,monospace;font-size:0.6rem;color:var(--muted);padding:3px 6px;text-align:center;border-left:1px solid var(--border);font-weight:400">Gross</th>'
    + '<th style="font-family:IBM Plex Mono,monospace;font-size:0.6rem;color:var(--gold);padding:3px 6px;text-align:center;font-weight:400">Net</th>'
    + '</tr>'+parRow+'</thead>'
    + '<tbody>'+scorecardRows+'</tbody></table></div>'
    + '<button class="big-btn green" id="jks-new-round">New Round</button>'
    + '<button class="big-btn ghost" id="jks-back-to-game">← Back to Round</button>'
    + '</div>';
}

// ── JKS SETUP EVENTS ──
function attachJKSSetupEvents() {
  const jks = state.jksSetup;
  document.querySelectorAll('.jks-pname').forEach(inp => {
    inp.addEventListener('input', e => { jks.players[parseInt(e.target.dataset.idx)].name = e.target.value; });
    inp.addEventListener('blur', () => render());
  });
  document.querySelectorAll('.jks-hcp').forEach(inp => {
    inp.addEventListener('input', e => { jks.players[parseInt(e.target.dataset.idx)].hcp = parseFloat(e.target.value)||0; });
  });
  document.querySelector('[data-jks-remove]')?.addEventListener('click', e => {
    jks.players.splice(parseInt(e.target.dataset.jksRemove),1); render();
  });
  document.getElementById('jks-add-player')?.addEventListener('click', () => { jks.players.push({name:'',hcp:0}); render(); });
  document.getElementById('jks-hcp-pct')?.addEventListener('input', e => { jks.hcpPct = parseFloat(e.target.value)||100; });
  document.getElementById('jks-start')?.addEventListener('click', () => {
    jks.players = jks.players.map((p,i) => ({...p, name: p.name.trim()||'Player '+(i+1)}));
    const scores = {};
    jks.players.forEach(p => { scores[p.name] = {}; });
    state.jksGame = { tab:'scorecard', currentHole:0, scores, confirmedHoles:0 };
    state.jksSaved = true;
    state.screen = 'jks-game';
    render();
  });
}

// ── JKS GAME EVENTS ──
function attachJKSGameEvents() {
  const jg = state.jksGame;
  const jks = state.jksSetup;

  document.querySelectorAll('[data-jks-tab]').forEach(t => {
    t.addEventListener('click', e => { jg.tab = e.target.dataset.jksTab; render(); });
  });
  document.getElementById('jks-end-round')?.addEventListener('click', () => { state.jksSaved=false; state.screen='home'; render(); });
  document.getElementById('jks-prev')?.addEventListener('click', () => { if(jg.currentHole>0){jg.currentHole--; render();} });
  document.getElementById('jks-next')?.addEventListener('click', () => { if(jg.currentHole<17){jg.currentHole++; render();} });

  document.querySelectorAll('[data-jks-up]').forEach(btn => {
    btn.addEventListener('click', e => {
      const p = e.target.dataset.jksUp;
      const hi = jg.currentHole;
      if (!jg.scores[p]) jg.scores[p] = {};
      const par = SJCC.holes[hi].par;
      jg.scores[p][hi] = (jg.scores[p][hi] != null ? jg.scores[p][hi] : par - 1) + 1;
      render();
    });
  });
  document.querySelectorAll('[data-jks-down]').forEach(btn => {
    btn.addEventListener('click', e => {
      const p = e.target.dataset.jksDown;
      const hi = jg.currentHole;
      if (!jg.scores[p]) jg.scores[p] = {};
      const par = SJCC.holes[hi].par;
      const cur = jg.scores[p][hi] != null ? jg.scores[p][hi] : par + 1;
      jg.scores[p][hi] = Math.max(1, cur - 1);
      render();
    });
  });

  document.getElementById('jks-confirm-hole')?.addEventListener('click', () => {
    jg.confirmedHoles = (jg.confirmedHoles || 0) + 1;
    jg.currentHole++;
    render();
  });

  document.getElementById('jks-finish-round')?.addEventListener('click', () => {
    jg.confirmedHoles = 18;
    jg.tab = 'summary';
    render();
  });

  document.getElementById('jks-new-round')?.addEventListener('click', () => { state.screen='jks-setup'; state.jksSaved=false; render(); });
  document.getElementById('jks-back-to-game')?.addEventListener('click', () => { jg.tab='scorecard'; render(); });
}
// ── BOOT ──
render();

// Register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/wolf-tracker/sw.js')
      .then(reg => {
        // Check for updates every time the page loads
        reg.update();
        // When a new SW is waiting, activate it immediately
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // New version available — reload to get fresh content
              newWorker.postMessage({ action: 'skipWaiting' });
              window.location.reload();
            }
          });
        });
      });
    // If the SW controller changes (new SW took over), reload
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      window.location.reload();
    });
  });
}
</script>
</body>
</html>
