<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>SJCC Test Scoring App</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #21262d; --border: #30363d;
  --green: #238636; --green-bright: #2ea043; --green-dim: #1a3a25; --green-text: #56d364;
  --red: #b91c1c; --red-bright: #da3633; --red-dim: #3a1a1a; --red-text: #f85149;
  --blue: #1f6feb; --blue-dim: #0d2a4a; --blue-text: #79c0ff;
  --purple: #6e40c9; --purple-dim: #1e1040; --purple-text: #d2a8ff;
  --gold: #d29922; --gold-bright: #e3b341; --gold-dim: #2d2007;
  --white: #f0f6fc; --muted: #8b949e; --radius: 10px;
}
html, body { height: 100%; background: var(--bg); color: var(--white); font-family: 'IBM Plex Sans', sans-serif; overflow: hidden; }
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; }

/* ── SHARED ── */
.screen { flex: 1; overflow-y: auto; padding: 20px 16px 40px; }
.top-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.top-bar-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.1em; color: var(--gold-bright); }
.back-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; padding: 5px 10px; cursor: pointer; touch-action: manipulation; }
.back-btn:hover { border-color: var(--gold); color: var(--gold); }
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto; }
.tab { flex: 1; min-width: 70px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 4px; cursor: pointer; white-space: nowrap; touch-action: manipulation; }
.tab.active { color: var(--gold-bright); border-bottom-color: var(--gold-bright); }
.tab-content { flex: 1; overflow-y: auto; padding: 16px; }
.section-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 8px; margin-top: 16px; }
.section-label:first-child { margin-top: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.field-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.field-row:last-child { margin-bottom: 0; }
.field-label { color: var(--muted); font-size: 0.85rem; flex: 1; }
.text-input { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; color: var(--white); font-family: 'IBM Plex Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.15s; width: 100%; }
.text-input:focus { border-color: var(--gold); }
.num-input { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; color: var(--white); font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; outline: none; width: 70px; text-align: right; -moz-appearance: textfield; }
.num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.num-input:focus { border-color: var(--gold); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; }
.toggle-label { color: var(--white); font-size: 0.9rem; }
.toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 24px; cursor: pointer; transition: 0.2s; }
.toggle-slider:before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: var(--white); border-radius: 50%; transition: 0.2s; }
.toggle input:checked + .toggle-slider { background: var(--green); }
.toggle input:checked + .toggle-slider:before { transform: translateX(20px); }
.big-btn { width: 100%; border: none; border-radius: var(--radius); font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.12em; padding: 15px; cursor: pointer; transition: all 0.15s; margin-bottom: 10px; touch-action: manipulation; }
.big-btn:active { transform: scale(0.98); }
.big-btn.green { background: var(--green); color: var(--white); }
.big-btn.green:hover { background: var(--green-bright); }
.big-btn.gold { background: var(--gold); color: var(--bg); }
.big-btn.gold:hover { background: var(--gold-bright); }
.big-btn.ghost { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 1.1rem; }
.big-btn.ghost:hover { border-color: var(--gold); color: var(--gold); }
.big-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }
.chip { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; font-weight: 500; display: inline-block; }
.chip.green { background: var(--green-dim); color: var(--green-text); border: 1px solid var(--green); }
.chip.red { background: var(--red-dim); color: var(--red-text); border: 1px solid var(--red); }
.chip.blue { background: var(--blue-dim); color: var(--blue-text); border: 1px solid var(--blue); }
.chip.purple { background: var(--purple-dim); color: var(--purple-text); border: 1px solid var(--purple); }
.chip.gray { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.chip.gold { background: var(--gold-dim); color: var(--gold-bright); border: 1px solid var(--gold); }
.seg-control { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg-btn { flex: 1; background: none; border: none; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; padding: 7px 4px; cursor: pointer; transition: all 0.15s; touch-action: manipulation; }
.seg-btn.active { background: var(--gold); color: var(--bg); font-weight: 600; }

/* ── HOME ── */
.home-logo { text-align: center; padding: 32px 0 24px; }
.home-logo h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 0.12em; color: var(--gold-bright); line-height: 1; }
.home-logo p { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 6px; }
.game-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 16px; touch-action: manipulation; }
.game-card:hover, .game-card:active { border-color: var(--gold); background: var(--surface2); }
.game-card-icon { font-size: 2rem; width: 48px; text-align: center; flex-shrink: 0; }
.game-card-text h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.1em; color: var(--white); }
.game-card-text p { color: var(--muted); font-size: 0.78rem; margin-top: 3px; }

/* ── SETUP ── */
.player-setup-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.player-setup-row:last-child { margin-bottom: 0; }
.player-idx { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--gold); width: 20px; flex-shrink: 0; }
.player-setup-row .text-input { flex: 2; }
.player-setup-row .num-input { width: 55px; }
.remove-btn { background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 4px; }
.remove-btn:hover { color: var(--red-text); }
.add-btn { width: 100%; background: none; border: 1px dashed var(--border); border-radius: 7px; color: var(--muted); font-size: 0.85rem; padding: 9px; cursor: pointer; margin-top: 4px; }
.add-btn:hover { border-color: var(--gold); color: var(--gold); }
.team-select { display: flex; gap: 6px; }
.team-btn { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; letter-spacing: 0.08em; padding: 6px; cursor: pointer; text-align: center; transition: all 0.15s; }
.team-btn.team-a { }
.team-btn.team-b { }
.team-btn.selected-a { background: var(--blue-dim); border-color: var(--blue-text); color: var(--blue-text); }
.team-btn.selected-b { background: var(--purple-dim); border-color: var(--purple-text); color: var(--purple-text); }

/* ── SCORECARD ── */
.hole-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.hole-nav-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--white); letter-spacing: 0.06em; }
.hole-nav-sub { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
.hole-meta { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.hole-meta-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
.hole-meta-item span { color: var(--white); font-weight: 600; }
.score-entry { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.score-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.score-player-name { flex: 1; font-weight: 600; font-size: 0.95rem; }
.score-player-hcp { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--muted); }
.score-stroke-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--gold-bright); background: var(--gold-dim); border-radius: 4px; padding: 1px 5px; }
.score-adj { display: flex; align-items: center; gap: 6px; }
.sc-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; color: var(--white); width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; touch-action: manipulation; }
.sc-btn:hover { border-color: var(--gold); }
.sc-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--white); min-width: 32px; text-align: center; }
.sc-val.eagle { color: #f0e68c; }
.sc-val.birdie { color: var(--gold-bright); }
.sc-val.par { color: var(--white); }
.sc-val.bogey { color: #ff9944; }
.sc-val.double { color: var(--red-text); }
.sc-val.worse { color: #cc0000; }
.sc-net { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--green-text); min-width: 36px; text-align: right; }
.hole-result-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
.hole-result-row { display: flex; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; padding: 3px 0; }
.hole-result-row .label { color: var(--muted); }
.press-btn { background: var(--blue-dim); border: 1px solid var(--blue); border-radius: 6px; color: var(--blue-text); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; padding: 5px 12px; cursor: pointer; }
.press-btn:hover { background: var(--blue); color: var(--white); }

/* ── LEADERBOARD / RESULTS ── */
.lb-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.lb-card-header { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 8px 14px; font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; letter-spacing: 0.1em; color: var(--gold); }
.lb-row { display: flex; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); gap: 8px; }
.lb-row:last-child { border-bottom: none; }
.lb-rank { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--muted); width: 22px; flex-shrink: 0; }
.lb-rank.gold { color: var(--gold-bright); }
.lb-name { flex: 1; font-weight: 600; font-size: 0.9rem; }
.lb-detail { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--muted); }
.lb-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; }
.lb-val.pos { color: var(--green-text); }
.lb-val.neg { color: var(--red-text); }
.lb-val.zero { color: var(--muted); }
.lb-val.blue { color: var(--blue-text); }
.match-status { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.06em; }
.match-status.up { color: var(--green-text); }
.match-status.down { color: var(--red-text); }
.match-status.even { color: var(--muted); }
.nassau-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.nassau-header { background: var(--surface2); padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.nassau-header-title { font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem; letter-spacing: 0.08em; color: var(--gold); }
.nassau-header-bet { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
.nassau-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.nassau-row:last-child { border-bottom: none; }
.nassau-bet-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
.stat-strip { display: flex; justify-content: space-around; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
.stat-item { text-align: center; }
.stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--white); }
.stat-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

/* ── TRANSITION OVERLAY ── */
.oak-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none; opacity: 0; transition: opacity 0.28s ease; }
.oak-overlay.visible { opacity: 1; pointer-events: all; }
.oak-overlay-title { font-family: Bebas Neue,sans-serif; font-size: 1.1rem; letter-spacing: 0.14em; color: var(--gold-bright); }
.oak-overlay-dots { display: flex; gap: 5px; margin-top: 4px; }
.oak-overlay-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: 0.3; animation: oak-pulse 1.2s ease-in-out infinite; }
.oak-overlay-dot:nth-child(2) { animation-delay: 0.2s; }
.oak-overlay-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes oak-pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

/* ── WOLF (inline) ── */
.wolf-player-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; transition: all 0.15s; user-select: none; margin-bottom: 8px; touch-action: manipulation; }
.wolf-player-card.winner { background: var(--green-dim); border-color: var(--green-text); }
.wolf-player-card.loser { background: var(--red-dim); border-color: var(--red-text); }
.wolf-player-card.push { background: var(--surface2); border-color: var(--muted); }
.wolf-player-card .pname { font-size: 1.05rem; font-weight: 600; }
.wolf-player-card.winner .pname { color: var(--green-text); }
.wolf-player-card.loser .pname { color: var(--red-text); }
.wolf-player-card.push .pname { color: var(--muted); }
.wolf-status-badge { font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem; letter-spacing: 0.1em; padding: 4px 12px; border-radius: 5px; }
.wolf-player-card.winner .wolf-status-badge { background: var(--green); color: var(--white); }
.wolf-player-card.loser .wolf-status-badge { background: var(--red); color: var(--white); }
.wolf-player-card.push .wolf-status-badge { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
.wolf-preview { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; line-height: 1.7; }
.wolf-preview .ml { color: var(--white); }
.wolf-preview .ml.g { color: var(--green-text); }
.wolf-preview .ml.r { color: var(--red-text); }
.bet-adjuster { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.bet-adj-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }
.adj-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--white); width: 28px; height: 28px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
.adj-btn:hover { border-color: var(--gold); }
.bet-dinput { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--gold-bright); background: none; border: none; border-bottom: 1px solid var(--gold); width: 52px; text-align: center; outline: none; -moz-appearance: textfield; }
.bet-dinput::-webkit-outer-spin-button, .bet-dinput::-webkit-inner-spin-button { -webkit-appearance: none; }

/* ── TOAST ── */
.toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--gold); border-radius: 8px; color: var(--gold-bright); font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; padding: 10px 20px; z-index: 200; white-space: nowrap; animation: toast-in 0.2s ease; pointer-events: none; }
@keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ═══════════════════════════════════════════
// SJCC COURSE DATA
// ═══════════════════════════════════════════
const SJCC = {
  name: 'San Jose Country Club',
  holes: [
    {num:1,  par:4, hcp:14, yds:295},
    {num:2,  par:4, hcp:10, yds:313},
    {num:3,  par:3, hcp:8,  yds:171},
    {num:4,  par:4, hcp:2,  yds:446},

    {num:8,  par:4, hcp:4,  yds:435},

    {num:10, par:3, hcp:9,  yds:209},
    {num:11, par:5, hcp:17, yds:474},
    {num:12, par:4, hcp:1,  yds:445},
    {num:13, par:4, hcp:5,  yds:411},
    {num:14, par:3, hcp:15, yds:169},
    {num:15, par:4, hcp:13, yds:368},
    {num:16, par:5, hcp:3,  yds:534},
    {num:17, par:5, hcp:11, yds:514},
    {num:18, par:4, hcp:7,  yds:363},
  ]
};

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const SK = 'tbd_scoring_v2';
function loadState() {
  try {
    // Clear old version keys
    localStorage.removeItem('tbd_scoring_v1');
    return JSON.parse(localStorage.getItem(SK)) || null;
  } catch { return null; }
}
function saveState() { localStorage.setItem(SK, JSON.stringify(state)); }

let state = loadState() || { screen: 'home' };
// Ensure critical objects always exist
if (!state.scores) state.scores = {};
if (!state.players) state.players = [];
if (!state.ptSaved) state.ptSaved = false;
if (!state.ssSaved) state.ssSaved = false;
if (!state.jksSaved) state.jksSaved = false;

// Inject transition overlay once
(function() {
  const overlay = document.createElement('div');
  overlay.id = 'oak-overlay';
  overlay.className = 'oak-overlay';
  overlay.innerHTML = `<svg width="200" height="160" viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg">
    <line x1="96" y1="172" x2="88" y2="272" fill="none" stroke="#2a1504" stroke-width="6" stroke-linecap="round"/>
    <line x1="88" y1="272" x2="100" y2="274" fill="none" stroke="#2a1504" stroke-width="4" stroke-linecap="round"/>
    <line x1="88" y1="272" x2="76" y2="274" fill="none" stroke="#2a1504" stroke-width="4" stroke-linecap="round"/>
    <path d="M160 268 Q154 230 150 195 Q147 165 152 138 Q156 118 164 102 Q170 88 178 76 L186 78 Q193 91 200 106 Q208 122 212 143 Q216 170 214 200 Q212 235 205 268 Z" fill="#3d2208"/>
    <path d="M175 265 Q172 235 170 200 Q168 172 172 145 Q175 125 182 108 Q184 125 188 148 Q192 175 190 202 Q188 232 185 265 Z" fill="#2a1504" opacity="0.45"/>

// ═══════════════════════════════════════════
// HANDICAP HELPERS
// ═══════════════════════════════════════════
// Returns number of strokes a player gets on a specific hole
function strokesOnHole(playerHcp, holeHcp, hcpPct = 100) {
  const adjHcp = Math.round(playerHcp * hcpPct / 100);
  if (adjHcp <= 0) return 0;
  if (adjHcp >= 18) {
    return adjHcp >= 18 + holeHcp ? 2 : 1;
  }
  return holeHcp <= adjHcp ? 1 : 0;
}

function netScore(gross, playerHcp, holeHcp, hcpPct = 100) {
  return gross - strokesOnHole(playerHcp, holeHcp, hcpPct);
}

function scoreLabel(gross, par) {
  const d = gross - par;
  if (d <= -2) return 'eagle';
  if (d === -1) return 'birdie';
  if (d === 0)  return 'par';
  if (d === 1)  return 'bogey';
  if (d === 2)  return 'double';
  return 'worse';
}

// ═══════════════════════════════════════════
// NASSAU HELPERS
// ═══════════════════════════════════════════
function computeNassauState(ns) {
  // ns = nassau setup object, state.ns
  // Returns match status for front, back, overall + all active presses
  const scores = state.scores || {};
  if (!state.scores) state.scores = {};
  const ng = state.nsGame || {};
  ns.presses = ng.presses || [];
  const { teamA, teamB, format, hcpPct } = ns;
  const result = { front: null, back: null, overall: null, presses: [] };

  function bestBallHole(team, holeIdx) {
    const hole = SJCC.holes[holeIdx];
    // Only count hole if ALL team members have scores entered
    const grosses = team.map(p => scores[p] && scores[p][holeIdx] != null ? scores[p][holeIdx] : null);
    if (grosses.some(g => g === null)) return null;
    if (format === 'match') {
      const nets = team.map((p, i) => {
        const pObj = state.players.find(pl => pl.name === p);
        return netScore(grosses[i], pObj ? pObj.hcp : 0, hole.hcp, hcpPct);
      });
      return Math.min(...nets);
    } else {
      const nets = team.map((p, i) => {
        const pObj = state.players.find(pl => pl.name === p);
        return netScore(grosses[i], pObj ? pObj.hcp : 0, hole.hcp, hcpPct);
      });
      return Math.min(...nets);
    }
  }

  function resolveMatch(startHole, endHole) {
    // Returns {aWins, bWins, holesPlayed, status, result}
    let aWins = 0, bWins = 0, holesPlayed = 0;
    for (let i = startHole; i <= endHole; i++) {
      const a = bestBallHole(teamA, i);
      const b = bestBallHole(teamB, i);
      if (a === null || b === null) break;
      holesPlayed++;
      if (a < b) aWins++;
      else if (b < a) bWins++;
    }
    const remaining = endHole - startHole + 1 - holesPlayed;
    const diff = aWins - bWins;
    let status = '';
    if (diff === 0) status = 'AS';
    else if (diff > 0) status = `A ${diff}UP`;
    else status = `B ${Math.abs(diff)}UP`;
    // Determine if closed out
    let closed = false;
    if (Math.abs(diff) > remaining && holesPlayed > 0) closed = true;
    return { aWins, bWins, holesPlayed, diff, status, closed, remaining };
  }

  result.front = resolveMatch(0, 8);
  result.back   = resolveMatch(9, 17);
  result.overall = resolveMatch(0, 17);

  // Presses — each press runs from startHole to endHole (fixed at segment end)
  result.presses = (ns.presses || []).map(pr => {
    const end = pr.endHole != null ? pr.endHole : (pr.segment === 'front' ? 8 : 17);
    return { ...pr, match: resolveMatch(pr.startHole, end) };
  });
  // Index by id for cascade lookups
  result.pressesById = {};
  result.presses.forEach(pr => { if (pr.id) result.pressesById[pr.id] = pr; });

  return result;
}

function nassauPayout(ns, nassauResult) {
  const bet = ns.bet || 0;
  function dollarResult(match, betAmt) {
    if (match.holesPlayed === 0) return null;
    if (match.diff === 0) return { a: 0, b: 0, label: 'Push' };
    if (match.diff > 0) return { a: betAmt, b: -betAmt, label: `A wins $${betAmt}` };
    return { a: -betAmt, b: betAmt, label: `B wins $${betAmt}` };
  }
  const results = [];
  if (ns.betFront) results.push({ name: 'Front 9', ...dollarResult(nassauResult.front, ns.betFront) });
  if (ns.betBack)  results.push({ name: 'Back 9',  ...dollarResult(nassauResult.back,  ns.betBack) });
  if (ns.betTotal) results.push({ name: 'Overall', ...dollarResult(nassauResult.overall, ns.betTotal) });
  nassauResult.presses.forEach((pr, i) => {
    results.push({ name: `Press ${i+1} (H${pr.startHole+1}+)`, ...dollarResult(pr.match, pr.bet || bet) });
  });
  return results;
}

// ═══════════════════════════════════════════
// SKINS HELPERS
// ═══════════════════════════════════════════
function computeSkinsState(ss) {
  const scores = state.scores || {};
  const players = state.players || [];
  const hcpPct = ss.hcpPct || 100;
  const carryover = ss.carryover || false;
  const skinType = ss.skinType || 'net'; // net | gross | canadian

  let skins = []; // per hole: { winner: name|null, carried: bool, pot: number }
  let carryPot = 1;

  for (let hi = 0; hi < 18; hi++) {
    const hole = SJCC.holes[hi];
    const holeScores = players.map(p => {
      const g = scores[p.name] && scores[p.name][hi] != null ? scores[p.name][hi] : null;
      if (g === null) return null;
      const strokes = strokesOnHole(p.hcp, hole.hcp, hcpPct);
      return { name: p.name, gross: g, net: g - strokes, strokes };
    });

    if (holeScores.some(s => s === null)) {
      skins.push({ hole: hi+1, winner: null, pot: carryPot, pending: true, carried: carryPot > 1 });
      continue;
    }

    let winner = null;

    if (skinType === 'gross') {
      const minGross = Math.min(...holeScores.map(s => s.gross));
      const grossWinners = holeScores.filter(s => s.gross === minGross);
      if (grossWinners.length === 1) winner = grossWinners[0].name;
    } else if (skinType === 'net') {
      const minNet = Math.min(...holeScores.map(s => s.net));
      const netWinners = holeScores.filter(s => s.net === minNet);
      if (netWinners.length === 1) winner = netWinners[0].name;
    } else if (skinType === 'canadian') {
      // Gross birdie or better always beats net birdie
      // Best gross score wins; tiebreaker is net
      const minGross = Math.min(...holeScores.map(s => s.gross));
      const par = hole.par;
      const grossBirdieOrBetter = holeScores.filter(s => s.gross <= par - 1);

      if (grossBirdieOrBetter.length === 1) {
        winner = grossBirdieOrBetter[0].name;
      } else if (grossBirdieOrBetter.length > 1) {
        // Tiebreaker: net
        const minNet = Math.min(...grossBirdieOrBetter.map(s => s.net));
        const netWinners = grossBirdieOrBetter.filter(s => s.net === minNet);
        winner = netWinners.length === 1 ? netWinners[0].name : null; // push if still tied
      } else {
        // No gross birdie — best net wins
        const minNet = Math.min(...holeScores.map(s => s.net));
        const netWinners = holeScores.filter(s => s.net === minNet);
        if (netWinners.length === 1) winner = netWinners[0].name;
      }
    }

    if (winner) {
      skins.push({ hole: hi+1, winner, pot: carryPot, carried: carryPot > 1 });
      carryPot = carryover ? 1 : 1;
      if (carryover) carryPot = 1;
    } else {
      skins.push({ hole: hi+1, winner: null, pot: carryover ? carryPot + 1 : carryPot, carried: carryPot > 1, push: true });
      if (carryover) carryPot++;
    }
  }
  return skins;
}

function skinsTotals(skinsState, skinBet, players) {
  const totals = {};
  players.forEach(p => totals[p.name] = 0);
  const winners = skinsState.filter(s => s.winner);
  const totalSkinners = winners.length;
  if (totalSkinners === 0) return totals;

  skinsState.forEach(s => {
    if (!s.winner) return;
    const loserCount = players.length - 1;
    const pot = loserCount * skinBet * s.pot;
    totals[s.winner] += pot;
    players.forEach(p => { if (p.name !== s.winner) totals[p.name] -= skinBet * s.pot; });
  });
  return totals;
}

// RENDER ENGINE
// ═══════════════════════════════════════════
let _prevScreen = null;
let _transitioning = false;

function render(skipTransition) {
  const app = document.getElementById('app');
  const scrollEl = document.querySelector('.screen') || document.querySelector('.tab-content');
  const scrollTop = scrollEl ? scrollEl.scrollTop : 0;
  const s = state.screen;

  // Determine if this is a screen change that warrants a transition
  const isScreenChange = _prevScreen !== null && _prevScreen !== s;
  const shouldTransition = !skipTransition && isScreenChange && !_transitioning;

  function doRender() {
    if (s === 'home')            app.innerHTML = renderHome();
    else if (s === 'wolf-setup') app.innerHTML = renderWolfSetup();
    else if (s === 'wolf-game')  app.innerHTML = renderWolfGame();
    else if (s === 'ns-setup')   app.innerHTML = renderNSSetup();
    else if (s === 'ns-game')    app.innerHTML = renderNSGame();
    else if (s === '9pt-setup')  app.innerHTML = render9ptSetup();
    else if (s === '9pt-game')   app.innerHTML = render9ptGame();
    else if (s === 'ss-setup')   app.innerHTML = renderSSSetup();
    else if (s === 'ss-game')    app.innerHTML = renderSSGame();
    else if (s === 'jks-setup')  app.innerHTML = renderJKSSetup();
    else if (s === 'jks-game')   app.innerHTML = renderJKSGame();
    attachEvents();
    saveState();
    const newScrollEl = document.querySelector('.screen') || document.querySelector('.tab-content');
    if (newScrollEl && scrollTop) newScrollEl.scrollTop = scrollTop;
    _prevScreen = s;
  }

  if (shouldTransition) {
    _transitioning = true;
    const overlay = document.getElementById('oak-overlay');
    // Fade overlay in
    overlay.classList.add('visible');
    setTimeout(() => {
      // Render new screen behind overlay
      doRender();
      // Hold briefly then fade out
      setTimeout(() => {
        overlay.classList.remove('visible');
        setTimeout(() => { _transitioning = false; }, 300);
      }, 900);
    }, 280);
  } else {
    doRender();
    _prevScreen = s;
  }
}

function renderWolfPlay() {
  const wg = state.wolfGame;
  const hi = wg.holeInput;
  const players = state.wolf.players;
  const winners = players.filter(p => hi.statuses[p] === 'winner');
  const losers  = players.filter(p => hi.statuses[p] === 'loser');
  const pot = losers.length * hi.bet;
  const winEach = winners.length > 0 ? pot / winners.length : 0;
  let preview = '';
  if (losers.length > 0 && winners.length > 0) {
    preview = `<div class="wolf-preview">
      <div class="ml">${losers.length} loser${losers.length>1?'s':''} × $${hi.bet} = $${pot} pot</div>
      <div class="ml g">Winners each get +$${winEach%1===0?winEach:winEach.toFixed(2)}</div>
      <div class="ml r">Losers each pay −$${hi.bet}</div>
    </div>`;
  }
  const cards = players.map(p => {
    const st = hi.statuses[p] || 'push';
    const label = st === 'winner' ? 'WIN' : st === 'loser' ? 'LOSS' : 'PUSH';
    return `<div class="wolf-player-card ${st}" data-wolf-player="${p}">
      <span class="pname">${p}</span><span class="wolf-status-badge">${label}</span>
    </div>`;
  }).join('');

  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div style="font-family:Bebas Neue,sans-serif;font-size:2rem;letter-spacing:0.06em">Hole ${wg.currentHole} <span style="font-size:1rem;color:var(--muted)">of 18</span></div>
    <div class="bet-adjuster">
      <div><div class="bet-adj-label">Bet</div>
      <div style="display:flex;align-items:center;gap:2px"><span style="font-family:Bebas Neue,sans-serif;font-size:1.3rem;color:var(--gold-bright)">$</span>
      <input class="bet-dinput" id="wolf-bet-input" type="number" min="1" value="${hi.bet}"/></div></div>
      <button class="adj-btn" id="wolf-bet-down">−</button>
      <button class="adj-btn" id="wolf-bet-up">+</button>
    </div>
  </div>
  <div style="margin-bottom:16px">${cards}</div>
  ${preview}
  <button class="big-btn gold" id="wolf-confirm-hole">Confirm Hole ${wg.currentHole}</button>`;
}

function renderWolfLeaderboard() {
  const wg = state.wolfGame;
  const totals = wolfTotals();
  if (wg.holes.length === 0) return `<div style="text-align:center;color:var(--muted);padding:40px 0">Complete a hole to see standings</div>`;
  return [...state.wolf.players].sort((a,b)=>totals[b]-totals[a]).map((p,i) => {
    const net = totals[p];
    const cls = net>0?'pos':net<0?'neg':'zero';
    const sign = net>0?'+':'';
    const wins   = wg.holes.filter(h=>h.results[p]>0).length;
    const losses = wg.holes.filter(h=>h.results[p]<0).length;
    return `<div class="lb-row" style="${i===0?'border-color:var(--gold)':''}">
      <span class="lb-rank ${i===0?'gold':''}">${i===0?'★':i+1}</span>
      <span class="lb-name">${p}</span>
      <span class="lb-detail">${wins}W ${losses}L</span>
      <span class="lb-val ${cls}">${sign}$${fmt(Math.abs(net))}</span>
    </div>`;
  }).join('');
}

function renderWolfPrev() {
  const wg = state.wolfGame;
  if (wg.holes.length === 0) return `<div style="text-align:center;color:var(--muted);padding:40px 0">No holes logged yet</div>`;
  return [...wg.holes].reverse().map((h, ri) => {
    const i = wg.holes.length - 1 - ri;
    const chips = state.wolf.players.map(p => `<span class="chip ${h.statuses[p]}">${p}</span>`).join(' ');
    const results = state.wolf.players.map(p => {
      const d = h.results[p];
      if (d===0) return '';
      return `<span class="chip ${d>0?'green':'red'}">${p}: ${d>0?'+':''}$${fmt(Math.abs(d))}</span>`;
    }).filter(Boolean).join(' ');
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-family:Bebas Neue,sans-serif;font-size:1.1rem;color:var(--gold)">Hole ${h.num}</span>
        <span style="font-family:IBM Plex Mono,monospace;font-size:0.72rem;color:var(--muted)">$${h.bet}/player</span>
        <button class="back-btn" data-wolf-edit="${i}">Edit</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">${chips}</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${results}</div>
    </div>`;
  }).join('');
}

function wolfTotals() {
  const totals = {};
  state.wolf.players.forEach(p => totals[p] = 0);
  (state.wolfGame.holes || []).forEach(h => {
    state.wolf.players.forEach(p => { totals[p] += (h.results[p] || 0); });
  });
  return totals;
}

function wolfHoleResult(bet, statuses, players) {
  const winners = players.filter(p => statuses[p]==='winner');
  const losers  = players.filter(p => statuses[p]==='loser');
  const results = {};
  players.forEach(p => results[p] = 0);
  if (winners.length > 0 && losers.length > 0) {
    const pot = losers.length * bet;
    const winEach = pot / winners.length;
    winners.forEach(p => results[p] = winEach);
    losers.forEach(p  => results[p] = -bet);
  }
  return results;
}

        <span class="toggle-slider"></span></label>
      </div>` : ''}
    </div>

    <button class="big-btn green" id="ns-start">Start Round →</button>
  </div>`;
}

// ═══════════════════════════════════════════
// NASSAU + SKINS GAME
// ═══════════════════════════════════════════
function renderNSGame() {
  const tab = state.nsGame.tab || 'scorecard';
  const ns = state.nsSetup;
  const tabs = ['Scorecard'];
  if (ns.nassau) tabs.push('Nassau');
  if (ns.skins)  tabs.push('Skins');
  tabs.push('Summary');

  return `<div class="top-bar"><span class="top-bar-title">⛳ ${SJCC.name.toUpperCase()}</span>
    <div style="display:flex;gap:6px">
      <button class="back-btn" id="ns-end-round" style="color:var(--red-text);border-color:var(--red)">End</button>
      <button class="back-btn" id="go-home">Home</button>
    </div>
  </div>
  <div class="tabs">${tabs.map(t=>`<button class="tab ${tab.toLowerCase()===t.toLowerCase()?'active':''}" data-ns-tab="${t.toLowerCase()}">${t}</button>`).join('')}</div>
  <div class="tab-content">
    ${tab==='scorecard' ? renderNSScorecard() : ''}
    ${tab==='nassau'    ? renderNSNassau()    : ''}
    ${tab==='skins'     ? renderNSSkins()     : ''}
    ${tab==='summary'   ? renderNSSummary()   : ''}
  </div>`;
}

function renderNSScorecard() {
  const ng = state.nsGame;
  const ns = state.nsSetup;
  const hi = ng.currentHole; // 0-indexed
  const hole = SJCC.holes[hi];
  const players = state.players;

  if (!state.scores) state.scores = {};
  const scoreRows = players.map(p => {
    const gross = (state.scores[p.name] || {})[hi];
    const strokes = strokesOnHole(p.hcp, hole.hcp, ns.hcpPct);
    const hasScore = gross != null;
    const net = hasScore ? gross - strokes : null;
    const slabel = hasScore ? scoreLabel(gross, hole.par) : '';

    return `<div class="score-row">
      <div style="flex:1">
        <div class="score-player-name">${p.name}</div>
        <div style="display:flex;gap:6px;margin-top:2px">
          <span class="score-player-hcp">Hcp ${p.hcp}</span>
          ${strokes > 0 ? `<span class="score-stroke-badge">+${strokes} stroke${strokes>1?'s':''}</span>` : ''}
        </div>
      </div>
      <div class="score-adj">
        <button class="sc-btn" data-sc-down="${p.name}">−</button>
        <div class="sc-val ${slabel}">${hasScore ? gross : '–'}</div>
        <button class="sc-btn" data-sc-up="${p.name}">+</button>
      </div>
      <div class="sc-net">${net != null ? `net ${net}` : ''}</div>
    </div>`;
  }).join('');

  // Nassau live status snippet
  let nassauSnip = '';
  if (ns.nassau) {
    const nr = computeNassauState(ns);
    const seg = hi < 9 ? 'front' : 'back';
    const match = seg === 'front' ? nr.front : nr.back;
    const aNames = ns.teamA.join('/');
    const bNames = ns.teamB.join('/');
    const thru = match.holesPlayed;
    const matchStatusColor = match.diff===0?'var(--muted)':match.diff>0?'var(--blue-text)':'var(--purple-text)';
    const matchStatusText = thru === 0 ? 'No scores yet' : match.status;
    const aLabel = ns.teamA.join('/');
    const bLabel = ns.teamB.join('/');
    nassauSnip = `<div class="hole-result-box" style="margin-bottom:10px">
      <div class="hole-result-row"><span class="label">${seg === 'front' ? 'Front' : 'Back'} · Thru ${thru}</span>
        <span style="font-family:Bebas Neue,sans-serif;font-size:1rem;color:${matchStatusColor}">${matchStatusText}</span>
      </div>
      <div class="hole-result-row" style="font-size:0.7rem">
        <span style="color:var(--blue-text)">${aLabel}</span>
        <span style="color:var(--muted)">vs</span>
        <span style="color:var(--purple-text)">${bLabel}</span>
      </div>
      ${ns.autoPress ? `<div class="hole-result-row"><span class="label">Auto press</span><span style="color:var(--muted);font-size:0.72rem">triggers at 2-down</span></div>` : ''}
      <div style="margin-top:6px"><button class="press-btn" id="ns-manual-press">+ Manual Press</button></div>
    </div>`;
  }

  const canGoPrev = hi > 0;
  const canGoNext = hi < 17;

  return `<div>
    <div class="hole-nav">
      <div>
        <div class="hole-nav-title">Hole ${hole.num}</div>
        <div class="hole-nav-sub">${SJCC.name}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="back-btn" id="sc-prev" ${canGoPrev?'':'disabled'}>← Prev</button>
        <button class="back-btn" id="sc-next" ${canGoNext?'':'disabled'}>Next →</button>
      </div>
    </div>
    <div class="hole-meta">
      <div class="hole-meta-item">Par <span>${hole.par}</span></div>
      <div class="hole-meta-item">Yds <span>${hole.yds}</span></div>
      <div class="hole-meta-item">Hcp <span>${hole.hcp}</span></div>
    </div>
    <div class="score-entry">${scoreRows}</div>
    ${nassauSnip}
    ${ng.currentHole < 17
      ? `<button class="big-btn gold" id="ns-confirm-hole">Confirm Hole ${hole.num} →</button>`
      : `<button class="big-btn green" id="ns-finish-round">Finish Round ✓</button>`
    }
  </div>`;
}

function renderNSNassau() {
  const ns = state.nsSetup;
  const nr = computeNassauState(ns);
  const payouts = nassauPayout(ns, nr);
  const aNames = ns.teamA.join(' / ');
  const bNames = ns.teamB.join(' / ');

  function statusColor(diff) {
    if (diff === 0) return 'var(--muted)';
    return diff > 0 ? 'var(--blue-text)' : 'var(--purple-text)';
  }
  function matchRow(label, match, bet, extra='') {
    return `<div class="nassau-row">
      <div style="flex:1">
        <div style="font-family:IBM Plex Mono,monospace;font-size:0.8rem;color:var(--white)">${label}</div>
        <div style="font-family:IBM Plex Mono,monospace;font-size:0.68rem;color:var(--muted)">${match.holesPlayed} holes played · $${bet}</div>
        ${extra}
      </div>
      <span style="font-family:Bebas Neue,sans-serif;font-size:1.2rem;color:${statusColor(match.diff)}">${match.status}</span>
    </div>`;
  }

  let pressRows = '';
  if (nr.presses.length > 0) {
    pressRows = nr.presses.map((pr, i) => {
      const typeLabel = pr.auto ? '⚡ Auto' : '👆 Manual';
      const typeColor = pr.auto ? 'var(--gold-bright)' : 'var(--blue-text)';
      const label = `Press ${i+1} · H${pr.startHole+1}–${pr.endHole+1}`;
      const extra = `<div style="display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap">
        <span style="font-family:IBM Plex Mono,monospace;font-size:0.68rem;color:${typeColor};background:var(--surface2);border:1px solid ${typeColor};border-radius:4px;padding:1px 7px">${typeLabel}</span>
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-family:IBM Plex Mono,monospace;font-size:0.68rem;color:var(--muted)">$</span>
          <input type="number" class="press-bet-input" data-press-idx="${i}" value="${pr.bet}" min="1"
            style="background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--white);font-family:IBM Plex Mono,monospace;font-size:0.72rem;width:50px;padding:2px 5px;outline:none;-moz-appearance:textfield"/>
        </div>
        <button class="press-remove-btn" data-press-idx="${i}"
          style="background:var(--red-dim);border:1px solid var(--red);border-radius:4px;color:var(--red-text);font-family:IBM Plex Mono,monospace;font-size:0.68rem;padding:2px 8px;cursor:pointer">Remove</button>
      </div>`;
      return matchRow(label, pr.match, pr.bet, extra);
    }).join('');
  }

  let payoutRows = payouts.map(p => {
    if (!p || p.a === undefined) return '';
    const winner = p.a > 0 ? `Team A (+$${fmt(p.a)})` : p.b > 0 ? `Team B (+$${fmt(p.b)})` : 'Push';
    return `<div class="hole-result-row"><span class="label">${p.name}</span>
      <span style="color:${p.a===0?'var(--muted)':p.a>0?'var(--blue-text)':'var(--purple-text)'}">${p.label||winner}</span>
    </div>`;
  }).join('');

  return `<div>
    <div class="stat-strip">
      <div class="stat-item"><div class="stat-val" style="color:var(--blue-text)">${aNames}</div><div class="stat-lbl">Team A</div></div>
      <div class="stat-item"><div class="stat-val" style="color:var(--purple-text)">${bNames}</div><div class="stat-lbl">Team B</div></div>
    </div>
    <div class="nassau-section">
      <div class="nassau-header"><span class="nassau-header-title">Match Status</span></div>
      ${matchRow('Front 9', nr.front, ns.betFront)}
      ${matchRow('Back 9', nr.back, ns.betBack)}
      ${matchRow('Overall', nr.overall, ns.betTotal)}
      ${pressRows}
    </div>
    ${payoutRows ? `<div class="card"><div style="font-family:Bebas Neue,sans-serif;font-size:0.9rem;letter-spacing:0.08em;color:var(--gold);margin-bottom:8px">Current Payouts</div>
      <div class="hole-result-box" style="margin:0">${payoutRows}</div></div>` : ''}
    <button class="big-btn ghost" id="ns-manual-press" style="margin-top:4px">+ Add Manual Press</button>
  </div>`;
}

function renderNSSkins() {
  const ns = state.nsSetup;
  const skinsState = computeSkinsState(ns);
  const totals = skinsTotals(skinsState, ns.skinBet, state.players);
  const sorted = [...state.players].sort((a,b) => totals[b.name] - totals[a.name]);

  const skinTypeLabel = ns.skinType === 'canadian' ? '🍁 Canadian' : ns.skinType === 'gross' ? 'Gross' : 'Net';

  const lbRows = sorted.map((p, i) => {
    const net = totals[p.name];
    const cls = net>0?'pos':net<0?'neg':'zero';
    const sign = net>0?'+':'';
    const won = skinsState.filter(s=>s.winner===p.name).length;
    return `<div class="lb-row ${i===0&&net>0?'':''}">
      <span class="lb-rank ${i===0&&net>0?'gold':''}">${i===0&&net>0?'★':i+1}</span>
      <span class="lb-name">${p.name}</span>
      <span class="lb-detail">${won} skin${won!==1?'s':''}</span>
      <span class="lb-val ${cls}">${sign}$${fmt(Math.abs(net))}</span>
    </div>`;
  }).join('');

  const holeRows = skinsState.map(s => {
    const hole = SJCC.holes[s.hole-1];
    if (s.pending) return `<div class="hole-result-row" style="padding:5px 0"><span class="label" style="color:var(--muted)">Hole ${s.hole} (Par ${hole.par})</span><span class="chip gray">Pending${s.carried?' · Carried':''}${s.pot>1?' · '+s.pot+'x':''}</span></div>`;
    if (s.push) return `<div class="hole-result-row" style="padding:5px 0"><span class="label" style="color:var(--muted)">Hole ${s.hole} (Par ${hole.par})</span><span class="chip gray">Push${ns.carryover?' → Carries':''}</span></div>`;
    return `<div class="hole-result-row" style="padding:5px 0"><span class="label" style="color:var(--muted)">Hole ${s.hole} (Par ${hole.par})</span>
      <span class="chip green">${s.winner}${s.carried?' ('+s.pot+'x)':''}</span></div>`;
  }).join('');

  return `<div>
    <div class="stat-strip">
      <div class="stat-item"><div class="stat-val">${skinTypeLabel}</div><div class="stat-lbl">Format</div></div>
      <div class="stat-item"><div class="stat-val">$${ns.skinBet}</div><div class="stat-lbl">Per Skin</div></div>
      <div class="stat-item"><div class="stat-val">${ns.carryover?'Yes':'No'}</div><div class="stat-lbl">Carryover</div></div>
    </div>
    <div class="lb-card"><div class="lb-card-header">Skins Leaderboard</div>${lbRows}</div>
    <div class="card"><div style="font-family:Bebas Neue,sans-serif;font-size:0.9rem;letter-spacing:0.08em;color:var(--gold);margin-bottom:8px">Hole by Hole</div>
      ${holeRows}
    </div>
  </div>`;
}

function renderNSSummary() {
  const ns = state.nsSetup;
  const totals = {};
  state.players.forEach(p => totals[p.name] = 0);

  // Add skins
  if (ns.skins) {
    const sk = skinsTotals(computeSkinsState(ns), ns.skinBet, state.players);
    state.players.forEach(p => totals[p.name] += sk[p.name] || 0);
  }

  // Add nassau
  if (ns.nassau) {
    const nr = computeNassauState(ns);
    const payouts = nassauPayout(ns, nr);
    payouts.forEach(po => {
      if (!po || po.a === undefined) return;
      ns.teamA.forEach(n => totals[n] = (totals[n]||0) + po.a);
      ns.teamB.forEach(n => totals[n] = (totals[n]||0) + po.b);
    });
  }

  if (!state.scores) state.scores = {};
  const holesPlayed = Object.values((state.scores[state.players[0]?.name]) || {}).filter(v=>v!=null).length;
  const parPlayed = SJCC.holes.slice(0, holesPlayed).reduce((s,h) => s+h.par, 0);

  // Build scorecard rows per player
  const scorecardRows = state.players.map(p => {
    let grossTotal = 0, netTotal = 0;
    const holeCells = SJCC.holes.slice(0, holesPlayed).map(hole => {
      const g = (state.scores[p.name] || {})[hole.num - 1];
      if (g == null) return '<td style="color:var(--muted);font-family:IBM Plex Mono,monospace;font-size:0.72rem;padding:4px 6px;text-align:center">–</td>';
      const strokes = strokesOnHole(p.hcp, hole.hcp, ns.hcpPct);
      const n = g - strokes;
      grossTotal += g;
      netTotal += n;
      const diff = g - hole.par;
      const color = diff <= -2 ? '#f0e68c' : diff === -1 ? 'var(--gold-bright)' : diff === 0 ? 'var(--white)' : diff === 1 ? '#ff9944' : 'var(--red-text)';
      return `<td style="color:${color};font-family:IBM Plex Mono,monospace;font-size:0.72rem;padding:4px 6px;text-align:center">${g}${strokes>0?'*':''}</td>`;
    }).join('');
    return `<tr>
      <td style="font-weight:600;font-size:0.85rem;padding:6px 10px;white-space:nowrap">${p.name}</td>
      ${holeCells}
      <td style="font-family:IBM Plex Mono,monospace;font-size:0.78rem;padding:4px 8px;text-align:center;color:var(--white);border-left:1px solid var(--border)">${grossTotal||'–'}</td>
      <td style="font-family:IBM Plex Mono,monospace;font-size:0.78rem;padding:4px 8px;text-align:center;color:var(--green-text)">${netTotal||'–'}</td>
    </tr>`;
  }).join('');

  const holeHeaders = SJCC.holes.slice(0, holesPlayed).map(h =>
    `<th style="font-family:IBM Plex Mono,monospace;font-size:0.65rem;color:var(--muted);padding:4px 6px;text-align:center;font-weight:400">${h.num}</th>`
  ).join('');

  const sorted = [...state.players].sort((a,b) => totals[b.name] - totals[a.name]);
  const moneyRows = sorted.map((p, i) => {
    const net = totals[p.name];
    const cls = net>0?'pos':net<0?'neg':'zero';
    const sign = net>0?'+':'';
    // Breakdown
    let skinsAmt = 0, nassauAmt = 0;
    if (ns.skins) {
      const sk = skinsTotals(computeSkinsState(ns), ns.skinBet, state.players);
      skinsAmt = sk[p.name] || 0;
    }
    nassauAmt = net - skinsAmt;
    const breakdown = [
      ns.nassau ? `Nassau: ${nassauAmt>=0?'+':''}$${fmt(Math.abs(nassauAmt))}` : '',
      ns.skins  ? `Skins: ${skinsAmt>=0?'+':''}$${fmt(Math.abs(skinsAmt))}` : ''
    ].filter(Boolean).join(' · ');
    return `<div class="lb-row">
      <span class="lb-rank ${i===0?'gold':''}">${i===0?'★':i+1}</span>
      <div style="flex:1;margin-left:8px">
        <div class="lb-name">${p.name}</div>
        <div style="font-family:IBM Plex Mono,monospace;font-size:0.68rem;color:var(--muted)">${breakdown}</div>
      </div>
      <span class="lb-val ${cls}" style="font-size:1.5rem">${sign}$${fmt(Math.abs(net))}</span>
    </div>`;
  }).join('');

  return `<div>
    <div class="stat-strip">
      <div class="stat-item"><div class="stat-val">${holesPlayed}</div><div class="stat-lbl">Holes</div></div>
      <div class="stat-item"><div class="stat-val">${parPlayed}</div><div class="stat-lbl">Par</div></div>
      <div class="stat-item"><div class="stat-val">${state.players.length}</div><div class="stat-lbl">Players</div></div>
    </div>

    <div class="lb-card" style="margin-bottom:12px">
      <div class="lb-card-header">Money — Final Standings</div>
      ${moneyRows}
    </div>

    <div class="card" style="overflow-x:auto;padding:10px">
      <div style="font-family:Bebas Neue,sans-serif;font-size:0.9rem;letter-spacing:0.08em;color:var(--gold);margin-bottom:8px">
        Scorecard <span style="font-size:0.7rem;color:var(--muted);font-family:IBM Plex Mono,monospace;font-weight:400">* = stroke received</span>
      </div>
      <table style="border-collapse:collapse;width:100%">
        <thead>
          <tr>
            <th style="font-family:IBM Plex Mono,monospace;font-size:0.65rem;color:var(--muted);padding:4px 10px;text-align:left;font-weight:400">Player</th>
            ${holeHeaders}
            <th style="font-family:IBM Plex Mono,monospace;font-size:0.65rem;color:var(--muted);padding:4px 8px;text-align:center;border-left:1px solid var(--border);font-weight:400">Gross</th>
            <th style="font-family:IBM Plex Mono,monospace;font-size:0.65rem;color:var(--green-text);padding:4px 8px;text-align:center;font-weight:400">Net</th>
          </tr>
          <tr>
            <td style="font-family:IBM Plex Mono,monospace;font-size:0.65rem;color:var(--muted);padding:2px 10px">Par</td>
            ${SJCC.holes.slice(0,holesPlayed).map(h=>`<td style="font-family:IBM Plex Mono,monospace;font-size:0.65rem;color:var(--muted);padding:2px 6px;text-align:center">${h.par}</td>`).join('')}
            <td style="font-family:IBM Plex Mono,monospace;font-size:0.65rem;color:var(--muted);padding:2px 8px;text-align:center;border-left:1px solid var(--border)">${parPlayed}</td>
            <td></td>
          </tr>
        </thead>
        <tbody>${scorecardRows}</tbody>
      </table>
    </div>

    <button class="big-btn green" id="ns-new-round">New Round</button>
    <button class="big-btn ghost" id="ns-back-to-game">← Back to Round</button>
  </div>`;
}

// ═══════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════
function fmt(n) { return n % 1 === 0 ? n : n.toFixed(2); }

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 2500);
}

// ═══════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════
function attachEvents() {
  const s = state.screen;
  // Universal
  document.getElementById('go-home')?.addEventListener('click', () => { state.screen = 'home'; render(); });

  if (s === 'home')      attachHomeEvents();
  if (s === 'wolf-setup') attachWolfSetupEvents();
  if (s === 'wolf-game')  attachWolfGameEvents();
  if (s === 'ns-setup')   attachNSSetupEvents();
  if (s === 'ns-game')    attachNSGameEvents();
  if (s === '9pt-setup')  attach9ptSetupEvents();
  if (s === '9pt-game')   attach9ptGameEvents();
  if (s === 'ss-setup')   attachSSSetupEvents();
  if (s === 'ss-game')    attachSSGameEvents();
  if (s === 'jks-setup')  attachJKSSetupEvents();
  if (s === 'jks-game')   attachJKSGameEvents();
}

function attachHomeEvents() {
  document.getElementById('home-wolf')?.addEventListener('click', () => { state.screen = 'wolf-setup'; render(); });
  document.getElementById('home-ns')?.addEventListener('click',   () => { state.screen = 'ns-setup';   render(); });
  document.getElementById('home-9pt')?.addEventListener('click',  () => { state.screen = '9pt-setup';  render(); });
  document.getElementById('home-ss')?.addEventListener('click',    () => { state.screen = 'ss-setup';   render(); });
  document.getElementById('home-jks')?.addEventListener('click',   () => { state.screen = 'jks-setup';  render(); });
  document.getElementById('resume-wolf')?.addEventListener('click', () => { state.screen = 'wolf-game'; render(); });
  document.getElementById('resume-ns')?.addEventListener('click',   () => { state.screen = 'ns-game';   render(); });
  document.getElementById('resume-9pt')?.addEventListener('click',  () => { state.screen = '9pt-game';  render(); });
  document.getElementById('resume-ss')?.addEventListener('click',   () => { state.screen = 'ss-game';   render(); });
  document.getElementById('resume-jks')?.addEventListener('click',  () => { state.screen = 'jks-game';  render(); });
}

function attachWolfSetupEvents() {
  document.querySelectorAll('.wolf-pname').forEach(inp => {
    inp.addEventListener('input', e => { state.wolf.players[parseInt(e.target.dataset.idx)] = e.target.value; });
    inp.addEventListener('blur', () => render());
  });
  document.querySelectorAll('[data-wolf-remove]').forEach(btn => {
    btn.addEventListener('click', e => { state.wolf.players.splice(parseInt(e.target.dataset.wolfRemove),1); render(); });
  });
  document.getElementById('wolf-add-player')?.addEventListener('click', () => { state.wolf.players.push(''); render(); });
  document.getElementById('wolf-default-bet')?.addEventListener('input', e => { state.wolf.defaultBet = parseFloat(e.target.value)||5; });
  document.getElementById('wolf-start')?.addEventListener('click', () => {
    state.wolf.players = state.wolf.players.map((p,i)=>p.trim()||`Player ${i+1}`);
    state.wolfGame = {
      tab: 'play', holes: [], currentHole: 1, editingHole: null,
      holeInput: { bet: state.wolf.defaultBet, statuses: {} }
    };
    state.wolf.players.forEach(p => state.wolfGame.holeInput.statuses[p] = 'push');
    state.wolfSaved = true;
    state.screen = 'wolf-game';
    render();
  });
}

function attachWolfGameEvents() {
  const wg = state.wolfGame;
  document.querySelectorAll('[data-wolf-tab]').forEach(t => {
    t.addEventListener('click', e => { wg.tab = e.target.dataset.wolfTab; render(); });
  });
  document.getElementById('wolf-end-round')?.addEventListener('click', () => {

      render();
    });

  // Modal
  if (wg.editingHole != null) {
    document.getElementById('wolf-modal-cancel')?.addEventListener('click', () => {
      wg.editingHole = null;
      wg.holeInput = { bet: state.wolf.defaultBet, statuses: {} };
      state.wolf.players.forEach(p => wg.holeInput.statuses[p] = 'push');
      render();

    document.getElementById('wolf-modal-overlay')?.addEventListener('click', e => {
      if (e.target.id==='wolf-modal-overlay') {

        state.wolf.players.forEach(p=>wg.holeInput.statuses[p]='push'); render();

      wg.holes[wg.editingHole] = { ...wg.holes[wg.editingHole], bet:hi.bet, statuses:{...hi.statuses}, results:wolfHoleResult(hi.bet,hi.statuses,state.wolf.players) };

      state.wolf.players.forEach(p=>wg.holeInput.statuses[p]='push'); render();
    });
  }

function checkAutoPress(holeIdx) {
  const ns = state.nsSetup;
  if (!ns.nassau || !ns.autoPress) return;
  const ng = state.nsGame;
  ng.presses = ng.presses || [];

  const seg = holeIdx < 9 ? 'front' : 'back';
  const segEnd = seg === 'front' ? 8 : 17;
  const nextHole = holeIdx + 1;

  // Can't open a press on the last hole or beyond
  if (nextHole > segEnd) return;

  // Safety: only run if all players have scores for this hole
  if (!state.scores) state.scores = {};
  const allScored = state.players.every(p =>
    state.scores[p.name] && state.scores[p.name][holeIdx] != null
  );
  if (!allScored) return;

  // Sync presses to ns so computeNassauState sees them
  ns.presses = ng.presses;
  const nr = computeNassauState(ns);

  // --- Check original segment match ---
  const origMatch = seg === 'front' ? nr.front : nr.back;
  // Only auto presses with no parentPressId count as "originated from original match"
  const origAutoPressed = ng.presses.some(p => p.segment === seg && p.auto && !p.parentPressId);
  if (!origAutoPressed && Math.abs(origMatch.diff) >= 2) {
    const id = `${Date.now()}-${Math.random()}`;
    ng.presses.push({
      id, parentPressId: null,
      startHole: nextHole, endHole: segEnd,
      segment: seg,
      bet: seg === 'front' ? ns.betFront : ns.betBack,
      auto: true, hasSpawned: false
    });
    ns.presses = ng.presses;
    showToast(`Auto-press opened — H${nextHole + 1} to ${segEnd + 1}`);
    return; // Only one press action per hole check
  }

  // --- Check each existing press for cascade ---
  // Re-sync after potential changes above
  ns.presses = ng.presses;
  const nr2 = computeNassauState(ns);

  for (let i = 0; i < ng.presses.length; i++) {
    const p = ng.presses[i];
    if (p.segment !== seg) continue;
    if (p.hasSpawned) continue;
    if (p.endHole < nextHole - 1) continue; // press ended before this hole
    if (p.startHole > holeIdx) continue; // press hasn't started yet

    const prResult = nr2.presses.find(pr => pr.id === p.id);
    if (!prResult) continue;

    if (Math.abs(prResult.match.diff) >= 2) {
      const id = `${Date.now()}-${Math.random()}`;
      p.hasSpawned = true;
      ng.presses.push({
        id, parentPressId: p.id,
        startHole: nextHole, endHole: segEnd,
        segment: seg,
        bet: p.bet,
        auto: true, hasSpawned: false
      });
      ns.presses = ng.presses;
      showToast(`Auto-press cascade — H${nextHole + 1} to ${segEnd + 1}`);
      return; // One press action per hole check
    }
  }
}

// 9 POINT GAME — SCORING ENGINE
// ═══════════════════════════════════════════

function compute9ptHole(netScores, blitz) {
  // netScores: { playerName: netScore }
  const players = Object.keys(netScores);
  const n = players.length; // 3 or 4
  const total = n === 3 ? 9 : 16;
  const scores = players.map(p => ({ name: p, net: netScores[p] }));
  scores.sort((a, b) => a.net - b.net);

  // Blitz check: winner by 2+ net strokes over everyone
  if (blitz && n >= 3) {
    const best = scores[0].net;
    const second = scores[1].net;
    if (second - best >= 2) {
      const pts = {};
      players.forEach(p => pts[p] = 0);
      pts[scores[0].name] = total;
      return { pts, blitz: true };
    }
  }

  const pts = {};
  players.forEach(p => pts[p] = 0);

  if (n === 3) {
    const [a, b, c] = scores;
    if (a.net === b.net && b.net === c.net) {
      // 3-way tie: 3-3-3
      scores.forEach(s => pts[s.name] = 3);
    } else if (a.net === b.net) {
      // Tie 1st: 4-4-1
      pts[a.name] = 4; pts[b.name] = 4; pts[c.name] = 1;
    } else if (b.net === c.net) {
      // Tie 2nd: 5-2-2
      pts[a.name] = 5; pts[b.name] = 2; pts[c.name] = 2;
    } else {
      // No tie: 5-3-1
      pts[a.name] = 5; pts[b.name] = 3; pts[c.name] = 1;
    }
  } else if (n === 4) {
    const [a, b, c, d] = scores;
    const s = [a.net, b.net, c.net, d.net];
    if (s[0]===s[1] && s[1]===s[2] && s[2]===s[3]) {
      // 4-way tie: 4-4-4-4
      scores.forEach(s => pts[s.name] = 4);
    } else if (s[0]===s[1] && s[1]===s[2]) {
      // 3-way tie 1st: 5-5-5-1
      pts[a.name]=5; pts[b.name]=5; pts[c.name]=5; pts[d.name]=1;
    } else if (s[1]===s[2] && s[2]===s[3]) {
      // 1st, 3-way tie 2nd: 7-3-3-3
      pts[a.name]=7; pts[b.name]=3; pts[c.name]=3; pts[d.name]=3;
    } else if (s[0]===s[1] && s[2]===s[3]) {
      // 2-way tie 1st, 2-way tie 3rd: 6-6-2-2
      pts[a.name]=6; pts[b.name]=6; pts[c.name]=2; pts[d.name]=2;
    } else if (s[0]===s[1]) {
      // 2-way tie 1st: 6-6-3-1
      pts[a.name]=6; pts[b.name]=6; pts[c.name]=3; pts[d.name]=1;
    } else if (s[1]===s[2]) {
      // Tie 2nd: 7-4-4-1
      pts[a.name]=7; pts[b.name]=4; pts[c.name]=4; pts[d.name]=1;
    } else if (s[2]===s[3]) {
      // Tie 3rd: 7-5-2-2
      pts[a.name]=7; pts[b.name]=5; pts[c.name]=2; pts[d.name]=2;
    } else {
      // No tie: 7-5-3-1
      pts[a.name]=7; pts[b.name]=5; pts[c.name]=3; pts[d.name]=1;
    }
  }
  return { pts, blitz: false };
}

function compute9ptTotals() {
  const pg = state.ptGame;
  const ps = state.ptSetup;
  const totals = {};
  ps.players.forEach(p => totals[p.name] = 0);
  (pg.holes || []).forEach(h => {
    if (!h.pts) return;
    ps.players.forEach(p => { totals[p.name] += (h.pts[p.name] || 0); });
  });
  return totals;
}

function compute9ptLedger() {
  const totals = compute9ptTotals();
  const ps = state.ptSetup;
  const vpp = ps.vpp || 1;
  const players = ps.players.map(p => p.name);
  const ledger = []; // { from, to, amount }
  for (let i = 0; i < players.length; i++) {
    for (let j = i + 1; j < players.length; j++) {
      const a = players[i], b = players[j];
      const diff = (totals[a] - totals[b]) * vpp;
      if (diff > 0) ledger.push({ from: b, to: a, amount: diff });
      else if (diff < 0) ledger.push({ from: a, to: b, amount: Math.abs(diff) });
    }
  }
  return ledger;
}

function render9ptScorecard() {
  const pg = state.ptGame;
  const ps = state.ptSetup;
  const hi = pg.currentHole;
  const hole = SJCC.holes[hi];
  const n = ps.players.length;
  const total = n === 3 ? 9 : 16;

  // Compute current hole points if all scored
  const holeScores = pg.scores || {};
  const allScored = ps.players.every(p => holeScores[p.name] && holeScores[p.name][hi] != null);
  let holeResult = null;
  if (allScored) {
    const netScores = {};
    ps.players.forEach(p => {
      const g = holeScores[p.name][hi];
      const strokes = strokesOnHole(p.hcp, hole.hcp, ps.hcpPct);
      netScores[p.name] = g - strokes;
    });
    holeResult = compute9ptHole(netScores, ps.blitz);
  }

  const scoreRows = ps.players.map(p => {
    const gross = (holeScores[p.name] || {})[hi];
    const strokes = strokesOnHole(p.hcp, hole.hcp, ps.hcpPct);
    const hasScore = gross != null;
    const net = hasScore ? gross - strokes : null;
    const slabel = hasScore ? scoreLabel(gross, hole.par) : '';
    const pts = holeResult ? holeResult.pts[p.name] : null;

    return `<div class="score-row">
      <div style="flex:1">
        <div class="score-player-name">${p.name}</div>

          ${pts != null ? `<span style="font-family:Bebas Neue,sans-serif;font-size:0.9rem;color:var(--gold-bright);background:var(--gold-dim);border-radius:4px;padding:1px 7px">${pts} pts</span>` : ''}
        </div>
      </div>
      <div class="score-adj">

      </div>
      <div class="sc-net">${net != null ? `net ${net}` : ''}</div>
    </div>`;
  }).join('');

  // Points validation display
  let validBox = '';
  if (holeResult) {
    const ptSum = Object.values(holeResult.pts).reduce((a,b)=>a+b,0);
    const label = holeResult.blitz ? `⚡ BLITZ — ${ps.players.find(p=>holeResult.pts[p.name]===total)?.name} wins all ${total} pts` : `${ptSum} pts distributed`;
    validBox = `<div class="hole-result-box" style="margin-bottom:10px">
      <div class="hole-result-row"><span class="label">Hole ${hole.num} result</span>
        <span style="color:${ptSum===total?'var(--green-text)':'var(--red-text)'};font-family:IBM Plex Mono,monospace;font-size:0.78rem">${label}</span>
      </div>
    </div>`;
  }

  return `<div>
    <div class="hole-nav">
      <div>
        <div class="hole-nav-title">Hole ${hole.num}</div>
        <div class="hole-nav-sub">${SJCC.name}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="back-btn" id="pt-prev" ${hi>0?'':'disabled'}>← Prev</button>
        <button class="back-btn" id="pt-next" ${hi<17?'':'disabled'}>Next →</button>
      </div>
    </div>
    <div class="hole-meta">
      <div class="hole-meta-item">Par <span>${hole.par}</span></div>
      <div class="hole-meta-item">Yds <span>${hole.yds}</span></div>
      <div class="hole-meta-item">Hcp <span>${hole.hcp}</span></div>
      <div class="hole-meta-item">Pts <span>${total}</span></div>
    </div>
    <div class="score-entry">${scoreRows}</div>
    ${validBox}
    ${hi < 17
      ? `<button class="big-btn gold" id="pt-confirm-hole">Confirm Hole ${hole.num} →</button>`
      : `<button class="big-btn green" id="pt-finish-round">Finish Round ✓</button>`
    }
  </div>`;
}

function render9ptLeaderboard() {
  const pg = state.ptGame;
  const ps = state.ptSetup;
  const holesPlayed = (pg.holes || []).length;
  if (holesPlayed === 0) return `<div style="text-align:center;color:var(--muted);padding:40px 0">Complete a hole to see standings</div>`;

  const totals = compute9ptTotals();
  const n = ps.players.length;
  const totalPossible = (n === 3 ? 9 : 16) * holesPlayed;
  const sorted = [...ps.players].sort((a,b) => totals[b.name] - totals[a.name]);

  return `<div>
    <div class="stat-strip">
      <div class="stat-item"><div class="stat-val">${holesPlayed}</div><div class="stat-lbl">Holes</div></div>
      <div class="stat-item"><div class="stat-val">${n===3?9:16}</div><div class="stat-lbl">Pts/Hole</div></div>
      <div class="stat-item"><div class="stat-val">$${ps.vpp}</div><div class="stat-lbl">Per Pt</div></div>
    </div>
    ${sorted.map((p, i) => {
      const pts = totals[p.name];
      const net = (pts - (totalPossible / n)) * ps.vpp;
      const cls = net > 0 ? 'pos' : net < 0 ? 'neg' : 'zero';
      const sign = net > 0 ? '+' : '';
      return `<div class="lb-row ${i===0?'leader':''}">
        <span class="lb-rank ${i===0?'gold':''}">${i===0?'★':i+1}</span>
        <span class="lb-name">${p.name}</span>
        <span class="lb-detail">${pts} pts</span>
        <span class="lb-val ${cls}">${sign}$${fmt(Math.abs(net))}</span>
      </div>`;
    }).join('')}
    ${render9ptHoleLog(pg.holes||[], ps.players, n)}
  </div>`;
}

function render9ptHoleLog(holes, players, n) {
  if (holes.length === 0) return '';
  const rows = holes.map(h => {
    const sorted = players.slice().sort((a,b) => (h.pts[b.name]||0) - (h.pts[a.name]||0));
    const ptsLine = sorted.map(p => {
      const pts = h.pts[p.name] || 0;
      const color = pts >= (n===3?5:7) ? 'var(--green-text)' : pts <= 1 ? 'var(--red-text)' : 'var(--white)';
      return '<span style="font-family:IBM Plex Mono,monospace;font-size:0.75rem;color:'+color+'">'+p.name+' <strong>'+pts+'</strong></span>';
    }).join('<span style="color:var(--border);margin:0 4px">·</span>');
    const blitzBadge = h.blitz ? '<span style="font-family:IBM Plex Mono,monospace;font-size:0.68rem;color:var(--gold-bright);background:var(--gold-dim);border-radius:4px;padding:1px 6px">⚡ Blitz</span>' : '';
    return '<div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px">'
      + '<span style="font-family:Bebas Neue,sans-serif;font-size:0.95rem;color:var(--gold);min-width:52px">H'+h.num+'</span>'
      + '<div style="display:flex;flex-wrap:wrap;gap:8px;flex:1">'+ptsLine+'</div>'
      + blitzBadge
      + '</div>';
  }).join('');
  return '<div class="card" style="margin-top:12px">'
    + '<div style="font-family:Bebas Neue,sans-serif;font-size:0.9rem;color:var(--gold);letter-spacing:0.08em;margin-bottom:8px">Hole by Hole</div>'
    + rows + '</div>';
}

// ── 9PT GAME EVENTS ──
function attach9ptGameEvents() {
  const pg = state.ptGame;
  const ps = state.ptSetup;

  document.querySelectorAll('[data-pt-tab]').forEach(t => {
    t.addEventListener('click', e => { pg.tab = e.target.dataset.ptTab; render(); });
  });
  document.getElementById('pt-end-round')?.addEventListener('click', () => { state.ptSaved=false; state.screen='home'; render(); });
  document.getElementById('pt-prev')?.addEventListener('click', () => { if(pg.currentHole>0){pg.currentHole--; render();} });
  document.getElementById('pt-next')?.addEventListener('click', () => { if(pg.currentHole<17){pg.currentHole++; render();} });

  // Score adjusters
  document.querySelectorAll('[data-pt-sc-up]').forEach(btn => {
    btn.addEventListener('click', e => {
      const p = e.target.dataset.ptScUp;
      const hi = pg.currentHole;
      if (!pg.scores[p]) pg.scores[p] = {};
      const par = SJCC.holes[hi].par;
      pg.scores[p][hi] = (pg.scores[p][hi] != null ? pg.scores[p][hi] : par - 1) + 1;
      render();
    });
  });
  document.querySelectorAll('[data-pt-sc-down]').forEach(btn => {
    btn.addEventListener('click', e => {
      const p = e.target.dataset.ptScDown;
      const hi = pg.currentHole;
      if (!pg.scores[p]) pg.scores[p] = {};
      const par = SJCC.holes[hi].par;
      const cur = pg.scores[p][hi] != null ? pg.scores[p][hi] : par + 1;
      pg.scores[p][hi] = Math.max(1, cur - 1);
      render();
    });
  });

  // Confirm hole — lock scores and compute points
  document.getElementById('pt-confirm-hole')?.addEventListener('click', () => {
    const hi = pg.currentHole;
    const hole = SJCC.holes[hi];
    const allScored = ps.players.every(p => pg.scores[p.name] && pg.scores[p.name][hi] != null);
    if (!allScored) { showToast('Enter scores for all players first'); return; }

    const netScores = {};
    ps.players.forEach(p => {
      const g = pg.scores[p.name][hi];
      const strokes = strokesOnHole(p.hcp, hole.hcp, ps.hcpPct);
      netScores[p.name] = g - strokes;
    });
    const result = compute9ptHole(netScores, ps.blitz);
    const blitzWinner = result.blitz ? Object.keys(result.pts).find(p => result.pts[p] === (ps.players.length===3?9:16)) : null;

    pg.holes[hi] = { num: hole.num, pts: result.pts, blitz: result.blitz, blitzWinner };
    pg.currentHole++;
    render();
  });

  // Finish round
  document.getElementById('pt-finish-round')?.addEventListener('click', () => {
    const hi = pg.currentHole;
    const hole = SJCC.holes[hi];
    const allScored = ps.players.every(p => pg.scores[p.name] && pg.scores[p.name][hi] != null);
    if (allScored) {
      const netScores = {};
      ps.players.forEach(p => {
        const g = pg.scores[p.name][hi];
        const strokes = strokesOnHole(p.hcp, hole.hcp, ps.hcpPct);
        netScores[p.name] = g - strokes;
      });
      const result = compute9ptHole(netScores, ps.blitz);
      const blitzWinner = result.blitz ? Object.keys(result.pts).find(p => result.pts[p] === (ps.players.length===3?9:16)) : null;
      pg.holes[hi] = { num: hole.num, pts: result.pts, blitz: result.blitz, blitzWinner };
    }
    pg.tab = 'summary';
    render();
  });

  document.getElementById('pt-new-round')?.addEventListener('click', () => { state.screen='9pt-setup'; state.ptSaved=false; render(); });
  document.getElementById('pt-back-to-game')?.addEventListener('click', () => { pg.tab='scorecard'; render(); });
}

function computeSSSkinsState() {
  const ss = state.ssSetup;
  const scores = state.ssGame.scores || {};
  const players = ss.players;
  const hcpPct = ss.hcpPct || 100;
  const skinType = ss.skinType || 'net';
  const carryover = ss.betMode === 'perhole' ? (ss.carryover || false) : false;

  let skins = [];
  let carryPot = 1;

  for (let hi = 0; hi < 18; hi++) {
    const hole = SJCC.holes[hi];
    const holeScores = players.map(p => {
      const g = scores[p.name] && scores[p.name][hi] != null ? scores[p.name][hi] : null;
      if (g === null) return null;
      const strokes = strokesOnHole(p.hcp, hole.hcp, hcpPct);
      return { name: p.name, gross: g, net: g - strokes, strokes };
    });

    if (holeScores.some(s => s === null)) {
      skins.push({ hole: hi+1, winner: null, pot: carryPot, pending: true, carried: carryPot > 1 });
      continue;
    }

    let winner = null;
    if (skinType === 'gross') {
      const minG = Math.min(...holeScores.map(s => s.gross));
      const gw = holeScores.filter(s => s.gross === minG);
      if (gw.length === 1) winner = gw[0].name;
    } else if (skinType === 'net') {
      const minN = Math.min(...holeScores.map(s => s.net));
      const nw = holeScores.filter(s => s.net === minN);
      if (nw.length === 1) winner = nw[0].name;
    } else if (skinType === 'canadian') {
      const par = hole.par;
      const minG = Math.min(...holeScores.map(s => s.gross));
      const birdies = holeScores.filter(s => s.gross <= par - 1);
      if (birdies.length === 1) {
        winner = birdies[0].name;
      } else if (birdies.length > 1) {
        const minNet = Math.min(...birdies.map(s => s.net));
        const nw = birdies.filter(s => s.net === minNet);
        winner = nw.length === 1 ? nw[0].name : null;
      } else {
        const minNet = Math.min(...holeScores.map(s => s.net));
        const nw = holeScores.filter(s => s.net === minNet);
        if (nw.length === 1) winner = nw[0].name;
      }
    }

    if (winner) {
      skins.push({ hole: hi+1, winner, pot: carryPot, carried: carryPot > 1 });
      carryPot = 1;
    } else {
      skins.push({ hole: hi+1, winner: null, pot: carryover ? carryPot : carryPot, carried: carryPot > 1, push: true });
      if (carryover) carryPot++;
    }
  }
  return skins;
}

function computeSSTotals(skinsState) {
  const ss = state.ssSetup;
  const players = ss.players;
  const totals = {};
  players.forEach(p => totals[p.name] = 0);

  // Only count completed holes (not pending ones)
  const completedSkins = skinsState.filter(s => !s.pending);

  if (ss.betMode === 'perhole') {
    // Each loser pays skinBet per skin won (with carryover multiplier)
    completedSkins.forEach(s => {
      if (!s.winner) return;
      const amtCents = Math.round(ss.skinBet * s.pot * 100);
      players.forEach(p => {
        if (p.name === s.winner) totals[p.name] = parseFloat((totals[p.name] + amtCents * (players.length - 1) / 100).toFixed(2));
        else totals[p.name] = parseFloat((totals[p.name] - amtCents / 100).toFixed(2));
      });
    });
  } else {
    // Total pot mode — pot is fixed, divide by skins won SO FAR
    // Running value: each skin worth totalPot / totalSkinsWon at current moment
    const totalPotCents = Math.round(ss.buyIn * players.length * 100);
    const totalSkinsWon = completedSkins.filter(s => s.winner).length;
    if (totalSkinsWon === 0) return totals;
    const basePerSkinCents = Math.floor(totalPotCents / totalSkinsWon);
    const remainderCents = totalPotCents - (basePerSkinCents * totalSkinsWon);

    // Find player with most skins (gets remainder), tiebreak by player order
    const skinCounts = {};
    players.forEach(p => { skinCounts[p.name] = completedSkins.filter(s => s.winner === p.name).length; });
    const sortedByWins = [...players].sort((a,b) => skinCounts[b.name] - skinCounts[a.name]);
    const remainderPlayer = sortedByWins[0].name;

    players.forEach(p => {
      const skinsWon = skinCounts[p.name];
      let payoutCents = skinsWon * basePerSkinCents;
      if (p.name === remainderPlayer && skinsWon > 0) payoutCents += remainderCents;
      // Gross payout from pot — everyone paid buy-in already, just show what you collect
      totals[p.name] = parseFloat((payoutCents / 100).toFixed(2));
    });
  }
  return totals;
}

    + '<div style="display:flex;gap:6px">'

    + '<button class="back-btn" id="go-home">Home</button>'
    + '</div></div>'
    + '<div class="tabs">'
    + '<button class="tab '+(tab==='scorecard'?'active':'')+'" data-ss-tab="scorecard">Scorecard</button>'
    + '<button class="tab '+(tab==='leaderboard'?'active':'')+'" data-ss-tab="leaderboard">Leaderboard</button>'
    + '<button class="tab '+(tab==='summary'?'active':'')+'" data-ss-tab="summary">Summary</button>'
    + '</div>'
    + '<div class="tab-content">'
    + (tab==='scorecard'   ? renderSSScorecard()   : '')
    + (tab==='leaderboard' ? renderSSLeaderboard() : '')
    + (tab==='summary'     ? renderSSSummary()     : '')
